<title>Bàn đấu nối tủ điện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Bố cục kiểu "bảng điều khiển trực tiếp":
   thanh tiêu đề + chỉ số · dải tiến độ đấu nối từng thiết bị · thư viện + nhật ký bên trái
   · bảng vẽ ở giữa · thuộc tính bên phải · thanh trạng thái dưới cùng */
:root{
  --bg:#f1f1ef; --panel:#ffffff; --panel-2:#f7f7f5; --line:#e4e4e0; --line-2:#cdcdc8;
  --ink:#111214; --ink-2:#464b53; --ink-3:#6c717a; --track:#e6e6e2;
  --accent:#d42a20; --accent-ink:#ffffff; --accent-soft:rgba(212,42,32,.09);
  --ok:#1f8a4c;
  --board:#fdfdfc; --grid:#efefec; --grid-major:#e1e1dd;
  --danger:#c8352a;
  --font-ui:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --hdr:0px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0f11; --panel:#15171a; --panel-2:#1b1e22; --line:#272a2f; --line-2:#363a40;
    --ink:#eceded; --ink-2:#aeb2b9; --ink-3:#858a92; --track:#2a2d32;
    --accent:#ff5b4c; --accent-ink:#1a0503; --accent-soft:rgba(255,91,76,.13); --ok:#4cc483;
    --board:#121417; --grid:#1a1d21; --grid-major:#24272c; --danger:#ff6a5e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f11; --panel:#15171a; --panel-2:#1b1e22; --line:#272a2f; --line-2:#363a40;
  --ink:#eceded; --ink-2:#aeb2b9; --ink-3:#858a92; --track:#2a2d32;
  --accent:#ff5b4c; --accent-ink:#1a0503; --accent-soft:rgba(255,91,76,.13); --ok:#4cc483;
  --board:#121417; --grid:#1a1d21; --grid-major:#24272c; --danger:#ff6a5e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.cap{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.app{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr) 304px;grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--panel)}

/* ---- Thanh tiêu đề ---- */
.top{grid-column:1/-1;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line);min-width:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;padding:12px 20px 12px 0;flex:none;min-width:0}
.mark{width:34px;height:34px;flex:none;display:grid;place-items:center;color:var(--accent)}
.mark svg{width:34px;height:34px}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand b i{font-style:normal;color:var(--ink-3);font-weight:500;margin:0 2px}
.live{display:flex;align-items:center;gap:6px;margin-top:3px;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:pulse 2s ease-in-out infinite}
.live .k{color:var(--accent);font-weight:600;letter-spacing:.06em}
@keyframes pulse{50%{opacity:.35}}
.stats{display:flex;margin-left:auto;min-width:0}
.stat{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:8px 22px;border-left:1px solid var(--line);min-width:0}
.stat small{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;white-space:nowrap}
.stat b{font-family:var(--font-mono);font-size:20px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b em{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:400}
.stat.hot b{color:var(--accent)}
.acts{display:flex;align-items:center;gap:6px;padding-left:18px;border-left:1px solid var(--line);flex:none}

.btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3)}
.btn:focus-visible,.sw:focus-visible,.lib-item:focus-visible,.tab:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.icon{width:32px;padding:0}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2);border-color:var(--line)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:600}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.35;cursor:default}
.mobile-only{display:none}

/* ---- Dải tiến độ từng thiết bị ---- */
.strip{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);scrollbar-width:thin;background:var(--panel)}
.card{flex:none;width:148px;display:flex;flex-direction:column;gap:6px;padding:7px 9px 8px;border:1px solid var(--line);border-radius:3px;background:var(--panel);cursor:pointer;text-align:left}
.card:hover{border-color:var(--line-2)}
.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card .hd{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;min-width:0}
.card .hd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.card .hd em{font-style:normal;color:var(--ink-3);font-weight:500}
.card.done .hd em{color:var(--accent)}
.card .bar{display:flex;gap:2px;height:8px}
.card .bar i{flex:1;background:var(--track);border-radius:1px}
.card .bar i.f{background:var(--accent)}
.card.idle{opacity:.6}
.strip .empty{padding:6px 0;font-size:12px}

/* ---- Thư viện + nhật ký ---- */
.lib{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 8px;flex:none}
.sec-head a,.sec-head .mono{font-size:10.5px;color:var(--ink-3)}
.lib-list{overflow:auto;min-height:0;flex:1;padding:0 8px 12px}
.lib-list h3{display:flex;justify-content:space-between;margin:14px 6px 4px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.lib-list h3:first-child{margin-top:2px}
.lib-item{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 6px;border:1px solid transparent;border-radius:3px;background:none;cursor:grab;text-align:left}
.lib-item:hover{border-color:var(--line-2);background:var(--panel-2)}
.lib-item .th{width:40px;height:34px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:2px}
.lib-item .th svg{width:34px;height:28px}
.lib-item b{display:block;font-size:12.5px;font-weight:500;line-height:1.25}
.lib-item small{display:block;font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-top:1px}
.lib-item .cnt{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);min-width:18px;text-align:right}
.lib-item .cnt.on{color:var(--accent);font-weight:600}

.log{flex:none;height:min(34%,300px);min-height:140px;display:flex;flex-direction:column;border-top:1px solid var(--line);margin:0}
.log .sec-head{padding:8px 10px 6px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.log .sec-head .t{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600}
.log .sec-head .t i{width:9px;height:9px;background:var(--accent);border-radius:1px}
.log ol{list-style:none;margin:0;padding:6px 0 10px;overflow:auto;flex:1;min-height:0;font-family:var(--font-mono);font-size:10.5px;line-height:1.75}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:0 12px 0 14px}
.log li .ts{color:var(--ink-3)}
.log li .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.log li .s{color:var(--ink-3)}
.log li.add .s,.log li.wire .s{color:var(--ok)}
.log li.del .s{color:var(--accent)}
.log li.sys .m{color:var(--ink)}
.log li:first-child{background:var(--accent-soft)}

/* ---- Bảng vẽ ---- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--board)}
.bbar{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--line);min-width:0;overflow-x:auto;scrollbar-width:none;background:var(--panel);flex:none}
.bbar::-webkit-scrollbar{display:none}
.bbar .ttl{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap;margin-right:auto;padding-right:12px}
.bbar .ttl i{width:7px;height:7px;background:var(--accent)}
.bbar .ttl span{color:var(--ink-3);font-weight:500}
.sep{width:1px;height:22px;background:var(--line);flex:none;margin-inline:4px}
.zoom{font-family:var(--font-mono);font-size:11px;width:42px;text-align:center;color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:4px;align-items:center;flex:none}
.swatches .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.board{position:relative;flex:1;min-width:0;min-height:0}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink-2);display:block}
#svg .comp{cursor:move}
#svg [data-seg]{cursor:pointer}
#svg [data-term]{cursor:crosshair}
.crop{position:absolute;width:14px;height:14px;border-color:var(--ink-3);border-style:solid;border-width:0;pointer-events:none;opacity:.7}
.crop.tl{top:10px;left:10px;border-top-width:1px;border-left-width:1px}
.crop.tr{top:10px;right:10px;border-top-width:1px;border-right-width:1px}
.crop.bl{bottom:10px;left:10px;border-bottom-width:1px;border-left-width:1px}
.crop.br{bottom:10px;right:10px;border-bottom-width:1px;border-right-width:1px}
.hint{position:absolute;left:16px;bottom:16px;right:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.hint .pill{pointer-events:auto;background:var(--panel);border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:2px;padding:6px 12px;color:var(--ink-2);font-size:12px;max-width:100%}
.hint .pill b{color:var(--ink)}
.hint .btn{pointer-events:auto;height:30px}
.tip{position:absolute;pointer-events:none;background:var(--accent);color:var(--accent-ink);font-family:var(--font-mono);font-size:11px;font-weight:600;padding:3px 7px;border-radius:2px;white-space:nowrap;transform:translate(-50%,-140%)}

/* ---- Thuộc tính ---- */
.insp{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;white-space:nowrap;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:12px 4px 10px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink-3)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-size:10px;color:var(--accent);margin-left:5px}
.pane{overflow:auto;padding:16px 16px 24px;min-height:0;flex:1}
.pane h2{font-size:16px;margin:0 0 3px;font-weight:700;letter-spacing:-.01em}
.pane .sub{color:var(--ink-3);font-size:12px;margin:0 0 16px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.field input,.field select,.field textarea{height:34px;border:1px solid var(--line-2);border-radius:3px;background:var(--panel);padding:0 10px;width:100%}
.field textarea{height:80px;padding:8px 10px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.terms{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 16px}
.terms span{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line-2);border-radius:2px;padding:2px 6px;color:var(--ink-2)}
.terms span.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.guide{margin:0;padding:0;list-style:none;counter-reset:g;display:flex;flex-direction:column;gap:10px;color:var(--ink-2);line-height:1.5}
.guide li{counter-increment:g;position:relative;padding-left:28px}
.guide li::before{content:counter(g,decimal-leading-zero);position:absolute;left:0;top:2px;font-family:var(--font-mono);font-size:10.5px;color:var(--accent);font-weight:600}
.guide b{color:var(--ink);font-weight:600}
kbd{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel-2)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.legend i{width:26px;height:6px;border-radius:3px;display:block}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-family:var(--font-mono);font-weight:600;color:var(--ink-3);font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:0 6px 8px;border-bottom:1px solid var(--line-2)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.m{font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
tr.on td{background:var(--accent-soft)}
tr.on td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.chip{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-3px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.empty{color:var(--ink-3);font-size:12.5px;line-height:1.5;padding:8px 0}

/* ---- Thanh trạng thái ---- */
.status{grid-column:1/-1;display:flex;align-items:center;gap:16px;height:28px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status .a{color:var(--accent)}
.status .grow{flex:1}
.status b{color:var(--ink);font-weight:600}

/* ---- Hộp thoại ---- */
.modal{position:fixed;inset:0;background:rgba(10,11,13,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--panel);border:1px solid var(--line-2);border-top:3px solid var(--accent);border-radius:4px;width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg header{padding:16px 18px 6px}
.dlg h2{font-size:17px;margin:0;font-weight:700}
.dlg p{margin:6px 0 0;color:var(--ink-2);line-height:1.55}
.dlg .body{padding:10px 18px;overflow:auto;min-height:0}
.dlg textarea{width:100%;height:220px;font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-2);border-radius:3px;background:var(--panel-2);padding:10px;resize:vertical}
.dlg img{display:block;max-width:100%;border:1px solid var(--line);border-radius:3px;background:#fff}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 18px 16px}
.ex{height:auto!important;padding:12px!important;flex-direction:column;align-items:flex-start!important;white-space:normal!important;text-align:left;gap:4px!important}
.ex span{color:var(--ink-3);font-weight:400}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:3px;font-size:12.5px;z-index:60;border-left:3px solid var(--accent);max-width:calc(100% - 32px)}

@media (max-width:1320px){
  .swatches .lbl{display:none}
  .bbar .ttl span{display:none}
}
@media (max-width:1180px){
  .stat{padding:8px 14px}
  .stat:nth-child(3){display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
  .top{flex-wrap:wrap}
  .brand{padding:10px 0 8px;flex:1 1 100%}
  .brand .live .x{display:none}
  .acts{border:0;padding:0 0 8px;width:100%;overflow-x:auto;scrollbar-width:none}
  .acts .btn{flex:1 0 auto}
  .stats{order:-1;display:none}
  .mobile-only{display:inline-flex}
  .lib,.insp{position:fixed;top:var(--hdr);bottom:0;z-index:30;width:min(320px,88vw);box-shadow:0 10px 40px rgba(0,0,0,.25);transition:transform .2s}
  .lib{left:0;transform:translateX(-105%);padding-left:env(safe-area-inset-left,0px)}
  .insp{right:0;transform:translateX(105%)}
  .lib.open,.insp.open{transform:none}
  .status .hide-m{display:none}
  .card{width:128px}
}
@media (prefers-reduced-motion:reduce){.lib,.insp{transition:none}.live .dot{animation:none}}
</style>

<div class="app">
  <header class="top" id="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 34 34"><rect x="2" y="9" width="30" height="16" rx="2" fill="currentColor"/><g fill="var(--panel)"><circle cx="9" cy="17" r="3"/><circle cx="17" cy="17" r="3"/><circle cx="25" cy="17" r="3"/></g><path d="M9 9V3M17 9V3M25 9V3M9 25v6M17 25v6M25 25v6" stroke="currentColor" stroke-width="2.4"/></svg></span>
      <div><b>BÀN ĐẤU NỐI <i>/</i> <span id="hdTitle">Tủ điện</span></b>
        <span class="live"><i class="dot"></i><span class="k">TỰ LƯU</span><span id="savedAt">--:--:--</span><span class="x">· sơ đồ lắp đặt tủ điện</span></span></div>
    </div>
    <div class="stats">
      <div class="stat"><small>Thiết bị</small><b id="stDev">0</b></div>
      <div class="stat"><small>Dây dẫn</small><b id="stWire">0</b></div>
      <div class="stat"><small>Chiều dài dây</small><b id="stLen">0<em> m</em></b></div>
      <div class="stat hot"><small>Cực đã đấu</small><b id="stTerm">0<em> / 0</em></b></div>
    </div>
    <div class="acts">
      <button class="btn mobile-only" id="bLib" type="button">＋ Thiết bị</button>
      <button class="btn" id="bExample" type="button">Mạch mẫu</button>
      <button class="btn" id="bNew" type="button">Trang trắng</button>
      <button class="btn" id="bData" type="button">Lưu / Mở</button>
      <button class="btn primary" id="bExport" type="button">Xuất bản vẽ</button>
      <button class="btn mobile-only" id="bInsp" type="button">Thuộc tính</button>
    </div>
  </header>

<script>
(()=>{
const G=10, STUB=20;
const snap=v=>Math.round(v/G)*G;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MONO="JetBrains Mono, ui-monospace, Menlo, monospace", SANS="Be Vietnam Pro, Arial, sans-serif";
function txt(x,y,s,o={}){const {size=8.5,fill='#2b3137',w=500,anchor='middle',font=MONO}=o;
  return `<text x="${x}" y="${y}" font-family="${font}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}">${esc(s)}</text>`}

/* ---------- Màu dây theo quy ước ---------- */
const WIRES=[
  {id:'brown',name:'Nâu (L1 / pha)',c:'#7b4a2c',e:'#3a2112'},
  {id:'black',name:'Đen (L2 / điều khiển)',c:'#2b2c2f',e:'#000000'},
  {id:'grey',name:'Xám (L3)',c:'#9aa1a8',e:'#5a6067'},
  {id:'blue',name:'Xanh dương (N)',c:'#2f86de',e:'#164a86'},
  {id:'pe',name:'Vàng-xanh (PE)',c:'#36a352',e:'#1b5a2a',s:'#f2d22e'},
  {id:'red',name:'Đỏ (pha C / DC +)',c:'#d63b30',e:'#7c1a13'},
  {id:'yel',name:'Vàng (pha A trung thế)',c:'#e0b214',e:'#7d6106'},
  {id:'grn',name:'Xanh lá (pha B trung thế)',c:'#2f9a4a',e:'#165026'},
  {id:'cu',name:'Đồng (thanh cái / tiếp địa)',c:'#c47a3b',e:'#6b3c14'},
  {id:'dblue',name:'Xanh đậm (DC −)',c:'#1d3f8f',e:'#0c1d47'},
  {id:'white',name:'Trắng',c:'#f2f2ee',e:'#8f8f8a'},
];
const wc=id=>WIRES.find(w=>w.id===id)||WIRES[1];
const SIZES=['0.5','0.75','1.0','1.5','2.5','4.0','6.0','10','16','25','35','50','95','150','240'];
const thick=sz=>parseFloat(sz)>=35;

const T=(id,label,x,y,d)=>({id,label,x,y,d});
const xs=n=>Array.from({length:n},(_,i)=>18+36*i);

/* ---------- Thư viện thiết bị ---------- */
const DEFS={
  rmu:{name:'Ngăn tủ RMU',cat:'Trung thế – RMU',prefix:'K',noTag:1,tl:'none',
    defaults:{kind:'C',rating:'24 kV · 630 A',fuse:'25 A'},
    props:[{k:'kind',l:'Chức năng ngăn',t:'select',o:[['C','C – Cầu dao phụ tải (lộ cáp)'],['T','T – Cầu dao + cầu chì (bảo vệ MBA)'],['V','V – Máy cắt (bảo vệ rơ le)']]},
      {k:'rating',l:'Định mức',t:'select',o:['24 kV · 630 A','24 kV · 400 A','24 kV · 200 A','36 kV · 630 A'].map(v=>[v,v])},
      {k:'fuse',l:'Cầu chì HRC (chỉ ngăn T)',t:'select',o:['6.3 A','10 A','16 A','20 A','25 A','31.5 A','40 A','63 A'].map(v=>[v,v])}],
    size(){return{w:180,h:420}},
    terms(){const L=['L1','L2','L3'],x=[30,72,114];return[...L.map((l,i)=>T('bb'+i,l,x[i],16,'up')),...L.map((l,i)=>T('c'+i,l,x[i],404,'down')),T('e','E',158,404,'down')]},
    spec(p){return ({C:'Ngăn cầu dao phụ tải',T:'Ngăn cầu dao – cầu chì HRC '+p.fuse,V:'Ngăn máy cắt chân không'}[p.kind])+' · '+p.rating},
    draw(p){const K={C:'CẦU DAO PHỤ TẢI',T:'BẢO VỆ MBA',V:'MÁY CẮT'}[p.kind]||'';const ln='stroke="#26313b" stroke-width="3" stroke-linecap="round" fill="none"';
      let s=`<rect width="180" height="420" rx="4" fill="url(#gGrey)" stroke="#6f767d"/><rect width="180" height="40" rx="4" fill="#aab0b6"/><rect y="40" width="180" height="22" fill="#2f3d4c"/>`
        +txt(90,55,(p.tag?p.tag+' · ':'')+K,{size:9,w:600,fill:'#fff',font:SANS});
      [30,72,114].forEach((x,i)=>s+=txt(x,37,'L'+(i+1),{size:8,w:600}));
      s+=`<rect x="12" y="70" width="156" height="196" rx="4" fill="#eef1f3" stroke="#9aa0a6"/><path d="M22 84H158" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>`;
      if(p.kind==='V')s+=`<path d="M90 84V104M90 124V246" ${ln}/><rect x="80" y="104" width="20" height="20" fill="#eef1f3" stroke="#26313b" stroke-width="2.5"/><path d="M84 108l12 12M96 108l-12 12" stroke="#26313b" stroke-width="2"/>`;
      else s+=`<path d="M90 84V112" ${ln}/><circle cx="90" cy="114" r="3.5" fill="none" stroke="#26313b" stroke-width="2"/><path d="M90 148L93 118" ${ln}/><path d="M90 148V${p.kind==='T'?158:246}" ${ln}/>`;
      if(p.kind==='T')s+=`<rect x="83" y="158" width="14" height="34" rx="2" fill="#eef1f3" stroke="#26313b" stroke-width="2.5"/><path d="M90 158V192" stroke="#26313b" stroke-width="1.5"/><path d="M90 192V246" ${ln}/>`+txt(124,180,p.fuse,{size:8,w:600});
      s+=`<path d="M90 214H110M110 214L122 202" ${ln}/><path d="M127 205v18M132 208v12M137 211v6" stroke="#26313b" stroke-width="2"/>`;
      s+=`<circle cx="40" cy="128" r="10" fill="#2b2f34" stroke="#000"/><path d="M36 128h8M40 124v8" stroke="#9aa0a6" stroke-width="2"/><circle cx="40" cy="194" r="10" fill="#2b2f34" stroke="#000"/><path d="M36 194h8M40 190v8" stroke="#9aa0a6" stroke-width="2"/>`
        +txt(40,150,p.kind==='V'?'CB':'LBS',{size:7.5,w:600})+txt(40,216,'ES',{size:7.5,w:600});
      s+=`<rect x="128" y="120" width="26" height="16" rx="2" fill="#d63b30"/><path d="M141 123v10" stroke="#fff" stroke-width="2.5"/>`;
      s+=`<rect x="20" y="230" width="72" height="28" rx="3" fill="#2b2f34"/>`+[34,56,78].map(x=>`<circle cx="${x}" cy="240" r="4" fill="#f2c230"/>`).join('')+txt(56,254,'VPIS',{size:6.5,fill:'#c9ced3'});
      s+=`<circle cx="138" cy="244" r="12" fill="#fff" stroke="#7a8087"/><path d="M129 250a11 11 0 0 1 4-13" stroke="#36a352" stroke-width="3" fill="none"/><path d="M138 244l-6-5" stroke="#26313b" stroke-width="1.6"/>`;
      s+=`<rect x="8" y="272" width="164" height="140" rx="4" fill="#56606a" stroke="#3a424a"/><rect x="18" y="292" width="144" height="104" rx="3" fill="#2f363d"/>`+txt(90,286,p.rating,{size:8.5,w:600,fill:'#eef2f5'});
      [30,72,114].forEach((x,i)=>s+=`<rect x="${x-3}" y="294" width="6" height="8" fill="#9aa0a6"/><rect x="${x-10}" y="300" width="20" height="38" rx="9" fill="#1b1f23" stroke="#000"/><rect x="${x-6}" y="336" width="12" height="56" fill="#121417"/>`+txt(x+13,320,'L'+(i+1),{size:7.5,fill:'#e9edf1',anchor:'start'}));
      return s+`<path d="M158 300V392" stroke="#c47a3b" stroke-width="3"/>`+txt(150,318,'E',{size:8,w:700,fill:'#e9edf1',anchor:'end'})}},

  mvcable:{name:'Cáp ngầm trung thế',cat:'Trung thế – RMU',prefix:'WC',tl:'none',
    defaults:{name:'Cáp đến từ lưới 22 kV',sec:'3×240'},
    props:[{k:'name',l:'Ghi chú tuyến cáp',t:'text'},{k:'sec',l:'Tiết diện (mm²)',t:'select',o:['3×50','3×95','3×150','3×240','3×(1×240)'].map(v=>[v,v])}],
    size(){return{w:150,h:120}},
    terms(){return[T('l1','L1',30,16,'up'),T('l2','L2',72,16,'up'),T('l3','L3',114,16,'up'),T('e','Màn chắn',140,16,'up')]},
    spec(p){return 'Cu/XLPE/PVC/DSTA/PVC '+p.sec+' mm² · 24 kV · đầu cáp T-plug'},
    draw(p){return `<rect width="150" height="34" rx="4" fill="#c9ced3" stroke="#8d939a"/><path d="M30 34C30 66 62 70 64 92M72 34V92M114 34C114 66 82 70 80 92" stroke="#1a1d20" stroke-width="9" fill="none"/>
      <path d="M140 34C140 72 94 80 86 92" stroke="#c47a3b" stroke-width="2.5" fill="none"/><rect x="54" y="88" width="36" height="20" rx="4" fill="#111"/>`
      +txt(75,118,p.name,{size:9.5,w:600,fill:'currentColor',font:SANS})}},

  fsens:{name:'Cảm biến dòng sự cố',cat:'Trung thế – RMU',prefix:'CT',noTag:1,tl:'none',
    defaults:{},props:[],
    size(){return{w:150,h:50}},
    terms(){return[T('s2','S2',0,15,'left'),T('s1','S1',0,35,'left')]},
    spec(){return 'Cảm biến vòng hở, ôm quanh cáp 3 pha'},
    draw(){return `<rect x="4" y="6" width="146" height="38" rx="19" fill="#2b3137" opacity=".9" stroke="#11151a"/><rect x="14" y="11" width="126" height="5" rx="2.5" fill="rgba(255,255,255,.2)"/>`
      +txt(16,19,'S2',{size:7,fill:'#e9edf1',anchor:'start'})+txt(16,39,'S1',{size:7,fill:'#e9edf1',anchor:'start'})+txt(144,30,'CT vòng',{size:7.5,w:600,fill:'#e9edf1',anchor:'end'})}},

  fpi:{name:'Chỉ thị sự cố (FPI)',cat:'Trung thế – RMU',prefix:'FPI',
    defaults:{trip:'400 A'},props:[{k:'trip',l:'Ngưỡng dòng sự cố',t:'select',o:['200 A','400 A','600 A','800 A','1000 A'].map(v=>[v,v])}],
    size(){return{w:140,h:110}},
    terms(){return[T('p','+',30,14,'up'),T('m','−',66,14,'up'),T('s1','S1',14,96,'down'),T('s2','S2',44,96,'down'),T('com','COM',90,96,'down'),T('no','NO',122,96,'down')]},
    spec(p){return 'Báo ngắn mạch pha + chạm đất · ngưỡng '+p.trip+' · tiếp điểm ra SCADA'},
    draw(p){return `<rect width="140" height="110" rx="5" fill="#e9ecef" stroke="#7a8087"/><rect width="140" height="28" rx="5" fill="#c9ced3"/><rect y="82" width="140" height="28" rx="5" fill="#c9ced3"/>
      <circle cx="30" cy="57" r="13" fill="url(#gL-red)" stroke="#7c1a13"/><rect x="56" y="44" width="74" height="26" rx="3" fill="#c6d4a4"/>`+txt(93,61,'I> '+p.trip,{size:10,fill:'#233019'})}},

  tx:{name:'Máy biến áp phân phối',cat:'Trung thế – RMU',prefix:'T',tlFill:'#1c232b',
    defaults:{kva:'400 kVA',vg:'Dyn11'},
    props:[{k:'kva',l:'Công suất',t:'select',o:['160 kVA','250 kVA','400 kVA','560 kVA','630 kVA','750 kVA','1000 kVA','1250 kVA'].map(v=>[v,v])},{k:'vg',l:'Tổ đấu dây',t:'select',o:['Dyn11','Yyn0'].map(v=>[v,v])}],
    size(){return{w:260,h:260}},
    terms(){return[T('A','A',30,16,'up'),T('B','B',72,16,'up'),T('C','C',114,16,'up'),T('E','Vỏ',236,16,'up'),T('a','a',58,244,'down'),T('b','b',94,244,'down'),T('c','c',130,244,'down'),T('n','n',166,244,'down')]},
    spec(p){return '22/0,4 kV · '+p.kva+' · '+p.vg},
    draw(p){let s=`<rect x="10" y="44" width="240" height="168" rx="6" fill="url(#gTank)" stroke="#4d5964"/>`;
      for(let x=20;x<244;x+=12)s+=`<rect x="${x}" y="56" width="5" height="144" rx="2" fill="rgba(0,0,0,.13)"/>`;
      s+=`<rect y="30" width="260" height="18" rx="3" fill="#6c7884"/><rect y="208" width="260" height="18" rx="3" fill="#6c7884"/>`;
      [30,72,114].forEach(x=>s+=`<rect x="${x-8}" y="22" width="16" height="22" rx="3" fill="#ece6d8" stroke="#9c958a"/><path d="M${x-8} 30h16M${x-8} 37h16" stroke="#b8b0a2"/>`);
      [58,94,130,166].forEach(x=>s+=`<rect x="${x-7}" y="214" width="14" height="20" rx="3" fill="#ece6d8" stroke="#9c958a"/>`);
      s+=`<rect x="150" y="84" width="88" height="70" rx="3" fill="#eef1f3" stroke="#7a8087"/>`+txt(194,104,'22/0,4 kV',{size:10,w:700})+txt(194,122,p.kva,{size:9.5})+txt(194,140,p.vg,{size:9.5});
      return s+txt(76,128,'MBA',{size:22,w:700,fill:'#fff',font:SANS})}},

  ebar:{name:'Thanh tiếp địa',cat:'Trung thế – RMU',prefix:'PE',tl:'none',
    defaults:{n:'6'},props:[{k:'n',l:'Số lỗ bắt bu lông',t:'select',o:['3','4','6','8','10'].map(v=>[v,v])}],
    size(p){return{w:36*(+p.n||6),h:44}},
    terms(p){return xs(+p.n||6).map((x,i)=>T('e'+i,'E'+(i+1),x,22,'down'))},
    bridges(p){const t=this.terms(p);return t.slice(1).map(x=>[t[0].id,x.id])},
    spec(p){return 'Thanh đồng 40×5 mm · '+p.n+' lỗ · nối hệ thống tiếp địa trạm'},
    draw(p){const w=36*(+p.n||6);return `<rect y="8" width="${w}" height="28" rx="3" fill="url(#gCu)" stroke="#7a4317"/>`}},
  tb:{name:'Cầu đấu',cat:'Nguồn & bảo vệ',prefix:'X',tl:'none',
    defaults:{labels:'L1,L2,L3,N,PE'},
    props:[{k:'labels',l:'Tên các cực, cách nhau bằng dấu phẩy',t:'text'}],
    labs(p){const a=String(p.labels||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,16);return a.length?a:['1']},
    size(p){return{w:36*this.labs(p).length,h:110}},
    terms(p){return this.labs(p).flatMap((l,i)=>[T(i+'a',l,18+36*i,14,'up'),T(i+'b',l,18+36*i,96,'down')])},
    bridges(p){return this.labs(p).map((l,i)=>[i+'a',i+'b'])},
    spec(p){return this.labs(p).length+' cực ('+this.labs(p).join(', ')+')'},
    draw(p){let s='';this.labs(p).forEach((l,i)=>{const x=36*i,u=l.toUpperCase(),isN=u==='N',isPE=u==='PE';
      const col=isN?'#2f80d8':isPE?'#36a352':'#b4b9bf';
      s+=`<rect x="${x+2}" y="0" width="32" height="110" rx="3" fill="${col}" stroke="rgba(0,0,0,.35)"/>`;
      if(isPE)s+=`<rect x="${x+2}" y="0" width="32" height="110" rx="3" fill="url(#pPE)"/>`;
      s+=`<rect x="${x+2}" y="30" width="32" height="50" fill="rgba(0,0,0,.10)"/><rect x="${x+6}" y="45" width="24" height="18" rx="2" fill="#fff" stroke="rgba(0,0,0,.25)"/>`+txt(x+18,58,l,{size:9,w:600});});return s}},

  mcb:{name:'Aptomat (MCB)',cat:'Nguồn & bảo vệ',prefix:'QF',
    defaults:{poles:3,rating:'C16'},
    props:[{k:'poles',l:'Số cực',t:'select',o:[['1','1P'],['2','2P'],['3','3P'],['4','4P']]},{k:'rating',l:'Dòng định mức',t:'select',o:['C6','C10','C16','C20','C25','C32','C40','C63','D16','D25'].map(v=>[v,v])}]
    ,size(p){return{w:36*(+p.poles||1),h:150}},
    terms(p){const n=+p.poles||1;return xs(n).flatMap((x,i)=>[T('t'+i,String(2*i+1),x,16,'up'),T('b'+i,String(2*i+2),x,134,'down')])},
    spec(p){return (p.poles||1)+'P '+p.rating},
    draw(p){const n=+p.poles||1;let s='';for(let i=0;i<n;i++){const x=36*i;
      s+=`<rect x="${x+1}" y="0" width="34" height="150" rx="3" fill="url(#gWhite)" stroke="#8d939a"/><rect x="${x+1}" y="0" width="34" height="30" rx="3" fill="#cdd2d7"/><rect x="${x+1}" y="120" width="34" height="30" rx="3" fill="#cdd2d7"/>`;
      s+=`<rect x="${x+11}" y="40" width="14" height="7" rx="1.5" fill="#e0412f"/><rect x="${x+7}" y="58" width="22" height="42" rx="3" fill="#202326"/><rect x="${x+9}" y="60" width="18" height="14" rx="2" fill="#3c4147"/>`;}
      if(n>1)s+=`<rect x="20" y="80" width="${36*(n-1)}" height="5" fill="#15171a"/>`;
      return s+txt(18,113,p.rating,{size:9,w:700})}},

  fuse:{name:'Cầu chì',cat:'Nguồn & bảo vệ',prefix:'FU',
    defaults:{poles:2,rating:'6A'},
    props:[{k:'poles',l:'Số cực',t:'select',o:[['1','1P'],['2','2P'],['3','3P']]},{k:'rating',l:'Dây chảy',t:'select',o:['2A','4A','6A','10A','16A','25A','32A'].map(v=>[v,v])}],
    size(p){return{w:36*(+p.poles||1),h:150}},
    terms(p){const n=+p.poles||1;return xs(n).flatMap((x,i)=>[T('t'+i,String(2*i+1),x,16,'up'),T('b'+i,String(2*i+2),x,134,'down')])},
    tlFill:'#e8ecef',
    spec(p){return (p.poles||1)+'P · '+p.rating+' gG'},
    draw(p){const n=+p.poles||1;let s='';for(let i=0;i<n;i++){const x=36*i;

function termOf(ref){const c=compById(ref.c);if(!c)return null;const t=DEFS[c.type].terms(c.p).find(t=>t.id===ref.t);return t?{c,t}:null}
function termWorld(ref){const r=termOf(ref);return r?{x:r.c.x+r.t.x,y:r.c.y+r.t.y,d:r.t.d}:null}
const tkey=r=>r.c+':'+r.t;
function termName(ref){const r=termOf(ref);if(!r)return '?';return (r.c.p.tag||DEFS[r.c.type].name)+':'+r.t.label}

function record(){hist.push(JSON.stringify(S));if(hist.length>120)hist.shift();fut=[]}
const hhmmss=()=>new Date().toTimeString().slice(0,8);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}const el=document.getElementById('savedAt');if(el)el.textContent=hhmmss()}
/* Nhật ký thao tác (chỉ trong phiên làm việc) */
const LOG=[];
function log(kind,msg,st){LOG.unshift({t:hhmmss(),kind,msg,st:st||({add:'thêm',wire:'nối',del:'xóa',sys:'ok',edit:'sửa'}[kind]||'')});if(LOG.length>80)LOG.pop();renderLog()}
function renderLog(){const el=document.getElementById('log');if(!el)return;el.innerHTML=LOG.length?LOG.map(l=>`<li class="${l.kind}"><span class="ts">[${l.t}]</span><span class="m">${esc(l.msg)}</span><span class="s">${esc(l.st)}</span></li>`).join(''):`<li><span class="ts">—</span><span class="m">Chưa có thao tác</span><span></span></li>`}
const compLabel=c=>(c.p.tag?c.p.tag+' ':'')+DEFS[c.type].name;
function changed(){cleanup();save();render();renderPanel()}
function cleanup(){S.wires=S.wires.filter(w=>termOf(w.a)&&termOf(w.b));if(sel&&sel.kind==='wire'&&!wireById(sel.id))sel=null;if(sel&&sel.kind==='comp'&&!compById(sel.id))sel=null}
function undo(){if(!hist.length)return;fut.push(JSON.stringify(S));S=JSON.parse(hist.pop());drawing=null;changed();log('sys','Hoàn tác','↶')}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(S));S=JSON.parse(fut.pop());drawing=null;changed();log('sys','Làm lại','↷')}

function nextTag(type){const pre=DEFS[type].prefix;if(!pre)return '';let n=0;S.comps.forEach(c=>{const m=String(c.p.tag||'').match(new RegExp('^'+pre+'(\\d+)$'));if(m)n=Math.max(n,+m[1])});return pre+(n+1)}
function addComp(type,x,y,extra){const d=DEFS[type];const c={id:uid(),type,x:snap(x),y:snap(y),p:{...d.defaults,...(extra||{})}};if(c.p.tag===undefined)c.p.tag=nextTag(type);S.comps.push(c);return c}

/* ---------- Đi dây ---------- */
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const stubOf=(p,L=STUB)=>({x:p.x+DV[p.d][0]*L,y:p.y+DV[p.d][1]*L});
const isV=d=>d==='up'||d==='down';
function autoRoute(a,b){const s1=stubOf(a),s2=stubOf(b);
  if(isV(a.d)&&isV(b.d)){
    if(a.d===b.d){const y=a.d==='up'?Math.min(s1.y,s2.y):Math.max(s1.y,s2.y);return[s1,{x:s1.x,y},{x:s2.x,y},s2]}
    const ok=a.d==='down'?s1.y<=s2.y:s1.y>=s2.y;
    if(ok){const my=snap((s1.y+s2.y)/2);return[s1,{x:s1.x,y:my},{x:s2.x,y:my},s2]}
    let mx=snap((s1.x+s2.x)/2);if(Math.abs(s1.x-s2.x)<40)mx=Math.max(s1.x,s2.x)+50;
    return[s1,{x:mx,y:s1.y},{x:mx,y:s2.y},s2]}
  return[s1,s2]}
function ortho(raw,d0){const out=[{x:raw[0].x,y:raw[0].y}];let pv=isV(d0);
  for(let i=1;i<raw.length;i++){const a=out[out.length-1],b=raw[i];if(a.x===b.x&&a.y===b.y)continue;
    if(a.x!==b.x&&a.y!==b.y){out.push(pv?{x:b.x,y:a.y}:{x:a.x,y:b.y})}else pv=a.x===b.x;
    out.push({x:b.x,y:b.y})}
  for(let i=1;i<out.length-1;){const a=out[i-1],b=out[i],c=out[i+1];if((a.x===b.x&&b.x===c.x)||(a.y===b.y&&b.y===c.y))out.splice(i,1);else i++}
  return out}
function wirePts(w){const A=termWorld(w.a),B=termWorld(w.b);if(!A||!B)return null;
  const raw=w.pts&&w.pts.length?[A,stubOf(A),...w.pts,stubOf(B),B]:[A,...autoRoute(A,B),B];return ortho(raw,A.d)}
function roundPath(p,r=9){let d=`M${p[0].x} ${p[0].y}`;
  for(let i=1;i<p.length-1;i++){const a=p[i-1],b=p[i],c=p[i+1];const l1=Math.hypot(b.x-a.x,b.y-a.y)||1,l2=Math.hypot(c.x-b.x,c.y-b.y)||1;const rr=Math.min(r,l1/2,l2/2);
    d+=` L${(b.x+(a.x-b.x)/l1*rr).toFixed(1)} ${(b.y+(a.y-b.y)/l1*rr).toFixed(1)} Q${b.x} ${b.y} ${(b.x+(c.x-b.x)/l2*rr).toFixed(1)} ${(b.y+(c.y-b.y)/l2*rr).toFixed(1)}`}
  const l=p[p.length-1];return d+` L${l.x} ${l.y}`}
function wireSvg(pts,col,sz){const d=roundPath(pts),k=thick(sz)?1.7:1;
  return `<path d="${d}" fill="none" stroke="${col.e}" stroke-width="${7*k}" stroke-linecap="round" stroke-linejoin="round"/>`+
  `<path d="${d}" fill="none" stroke="${col.c}" stroke-width="${4.6*k}" stroke-linecap="round" stroke-linejoin="round"/>`+
  (col.s?`<path d="${d}" fill="none" stroke="${col.s}" stroke-width="${4.6*k}" stroke-dasharray="9 9"/>`:'')+
  `<path d="${d}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.3" transform="translate(-1 -1)"/>`}
function ferrule(T,sz){const v=DV[T.d],big=thick(sz);return `<path d="M${T.x+v[0]*4} ${T.y+v[1]*4}L${T.x+v[0]*(big?16:14)} ${T.y+v[1]*(big?16:14)}" stroke="${big?'#b98a4e':'#d8342a'}" stroke-width="${big?13:8.5}"/><path d="M${T.x+v[0]*4} ${T.y+v[1]*4}L${T.x+v[0]*14} ${T.y+v[1]*14}" stroke="rgba(255,255,255,.3)" stroke-width="2" transform="translate(-2 -1)"/>`}

/* ---------- Mạch (net) ---------- */
function netOf(key){const adj=new Map();const link=(a,b)=>{(adj.get(a)||adj.set(a,[]).get(a)).push(b);(adj.get(b)||adj.set(b,[]).get(b)).push(a)};
  S.wires.forEach(w=>link(tkey(w.a),tkey(w.b)));
  S.comps.forEach(c=>{const d=DEFS[c.type];if(d.bridges)d.bridges(c.p).forEach(([x,y])=>link(c.id+':'+x,c.id+':'+y))});
  const seen=new Set([key]),st=[key];while(st.length){const k=st.pop();(adj.get(k)||[]).forEach(n=>{if(!seen.has(n)){seen.add(n);st.push(n)}})}return seen}

/* ---------- Vẽ ---------- */
function compSvg(c,forExport){const d=DEFS[c.type];const {w,h}=d.size(c.p);
  let s=`<g transform="translate(${c.x},${c.y})"${forExport?'':` data-comp="${c.id}" class="comp"`}>`+d.draw(c.p);
  d.terms(c.p).forEach(t=>{s+=`<rect x="${t.x-11}" y="${t.y-11}" width="22" height="22" rx="3" fill="#e4e7ea" stroke="#8f969d"/><circle cx="${t.x}" cy="${t.y}" r="8" fill="url(#gScrew)" stroke="#5f656b"/><path d="M${t.x-5} ${t.y-1.1}h10v2.2h-10zM${t.x-1.1} ${t.y-5}h2.2v10h-2.2z" fill="#4c5156" transform="rotate(25 ${t.x} ${t.y})"/>`;
    if(d.tl==='none')return;
    if(d.tl==='side')s+=txt(t.x+15,t.y+3,t.label,{size:8.5,w:600,anchor:'start',fill:'currentColor'});
    else s+=txt(t.x,t.d==='up'?t.y+20:t.y-14,t.label,{size:8,w:600,fill:d.tlFill||'#2b3137'});});
  if(!d.noTag&&c.p.tag)s+=txt(-8,h/2+4,c.p.tag,{size:11,w:700,anchor:'end',fill:'currentColor',font:SANS});
  return s+'</g>'}
function render(){
  const net=hoverTerm?netOf(hoverTerm):(sel&&sel.kind==='wire'&&wireById(sel.id))?netOf(tkey(wireById(sel.id).a)):null;
  let under='',dev='',over='',wires='',glow='',hot='',hits='';
  [...S.comps].sort((a,b)=>(DEFS[a.type].layer??1)-(DEFS[b.type].layer??1)).forEach(c=>{const L=DEFS[c.type].layer??1;const g=compSvg(c);if(L===0)under+=g;else if(L===2)over+=g;else dev+=g});
  const used=new Set();
  S.wires.forEach((w,i)=>{const p=wirePts(w);if(!p)return;used.add(tkey(w.a));used.add(tkey(w.b));
    const on=sel&&sel.kind==='wire'&&sel.id===w.id;const inNet=net&&net.has(tkey(w.a));
    if(on||inNet)glow+=`<path d="${roundPath(p)}" fill="none" stroke="var(--accent)" stroke-opacity="${on?.55:.35}" stroke-width="${on?16:13}" stroke-linecap="round" stroke-linejoin="round"/>`;
    wires+=wireSvg(p,wc(w.color),w.size)+ferrule({...p[0],d:termWorld(w.a).d},w.size)+ferrule({...p[p.length-1],d:termWorld(w.b).d},w.size);
    for(let j=0;j<p.length-1;j++)hits+=`<line x1="${p[j].x}" y1="${p[j].y}" x2="${p[j+1].x}" y2="${p[j+1].y}" stroke="transparent" stroke-width="14" data-seg="${w.id}:${j}"/>`;
    if(on)for(let j=1;j<p.length-2;j++){const mx=(p[j].x+p[j+1].x)/2,my=(p[j].y+p[j+1].y)/2,hz=p[j].y===p[j+1].y;
      hits+=`<rect x="${mx-(hz?9:4)}" y="${my-(hz?4:9)}" width="${hz?18:8}" height="${hz?8:18}" rx="4" fill="var(--panel)" stroke="var(--accent)" stroke-width="2" data-seg="${w.id}:${j}" style="cursor:${hz?'ns':'ew'}-resize"/>`}});
  let selBox='';
  if(sel&&sel.kind==='comp'){const c=compById(sel.id);if(c){const {w,h}=DEFS[c.type].size(c.p);selBox=`<rect x="${c.x-8}" y="${c.y-8}" width="${w+16}" height="${h+16}" rx="8" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>`}}
  S.comps.forEach(c=>DEFS[c.type].terms(c.p).forEach(t=>{const k=c.id+':'+t.id,x=c.x+t.x,y=c.y+t.y;
    const isStart=drawing&&tkey(drawing.a)===k, isHover=hoverTerm===k, inNet=net&&net.has(k);
    if(isStart||isHover||inNet||(drawing&&!used.has(k)))hot+=`<circle cx="${x}" cy="${y}" r="${isStart||isHover?12:10}" fill="${isStart||isHover?'var(--accent-soft)':'none'}" stroke="var(--accent)" stroke-width="${isStart||isHover||inNet?2.5:1}" stroke-opacity="${isStart||isHover||inNet?1:.45}"/>`;
    hot+=`<circle cx="${x}" cy="${y}" r="13" fill="transparent" data-term="${k}"/>`}));
  let pre='';
  if(drawing){const A=termWorld(drawing.a);if(A){const pts=ortho([A,stubOf(A),...drawing.pts,drawing.cur],A.d);
    pre=`<path d="${roundPath(pts)}" fill="none" stroke="${wc(curColor).c}" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="${roundPath(pts)}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 5"/>`;
    drawing.pts.forEach(p=>pre+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent)"/>`)}}
  world.innerHTML=under+dev+glow+wires+over+selBox+pre+hits+hot;
  document.getElementById('bUndo').disabled=!hist.length;document.getElementById('bRedo').disabled=!fut.length;
  renderHint();
}
function renderHint(){const h=document.getElementById('hint');
  if(drawing){h.innerHTML=`<span class="pill">Đang nối từ <b>${esc(termName(drawing.a))}</b> · chạm cực đích để nối · chạm nền để thêm điểm gấp</span><button class="btn" id="hCancel" type="button">Hủy dây (Esc)</button>`;document.getElementById('hCancel').onclick=()=>{drawing=null;render()}}
  else if(sel&&sel.kind==='wire')h.innerHTML=`<span class="pill">Kéo ô tròn trên đoạn dây để chỉnh đường đi · <b>Delete</b> để xóa dây</span>`;
  else h.innerHTML=S.comps.length?`<span class="pill">Chạm vào <b>ốc đấu</b> để bắt đầu một sợi dây · kéo nền để di chuyển bản vẽ</span>`:`<span class="pill">Bản vẽ trống · chọn thiết bị ở cột trái hoặc bấm <b>Mạch mẫu</b></span>`}

/* ---------- Khung nhìn ---------- */
function applyView(){const r=svg.getBoundingClientRect();const W=r.width/view.k,H=r.height/view.k;
  svg.setAttribute('viewBox',`${view.x} ${view.y} ${W} ${H}`);
  bgRect.setAttribute('x',Math.floor(view.x/50)*50-50);bgRect.setAttribute('y',Math.floor(view.y/50)*50-50);bgRect.setAttribute('width',W+150);bgRect.setAttribute('height',H+150);
  document.getElementById('zoomLbl').textContent=Math.round(view.k*100)+'%'}
function zoomAt(k,cx,cy){const r=svg.getBoundingClientRect();k=Math.min(3,Math.max(.2,k));const wx=view.x+(cx-r.left)/view.k,wy=view.y+(cy-r.top)/view.k;view.k=k;view.x=wx-(cx-r.left)/k;view.y=wy-(cy-r.top)/k;applyView()}
function bbox(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;S.comps.forEach(c=>{const {w,h}=DEFS[c.type].size(c.p);x0=Math.min(x0,c.x-40);y0=Math.min(y0,c.y);x1=Math.max(x1,c.x+w);y1=Math.max(y1,c.y+h)});
  S.wires.forEach(w=>(wirePts(w)||[]).forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)}));
  return x0>x1?{x:0,y:0,w:800,h:600}:{x:x0-30,y:y0-30,w:x1-x0+60,h:y1-y0+60}}
function fit(){const r=svg.getBoundingClientRect();const b=bbox();const k=Math.min(1.6,Math.max(.2,Math.min(r.width/b.w,r.height/b.h)*.95));view.k=k;view.x=b.x-(r.width/k-b.w)/2;view.y=b.y-(r.height/k-b.h)/2;applyView()}
const toWorld=e=>{const r=svg.getBoundingClientRect();return{x:view.x+(e.clientX-r.left)/view.k,y:view.y+(e.clientY-r.top)/view.k}};

/* ---------- Tương tác ---------- */
const ptrs=new Map();let pinch=null;
function finishWire(ref){const a=drawing.a;if(tkey(a)===tkey(ref)){drawing=null;render();return}
  if(S.wires.some(w=>(tkey(w.a)===tkey(a)&&tkey(w.b)===tkey(ref))||(tkey(w.b)===tkey(a)&&tkey(w.a)===tkey(ref)))){drawing=null;toast('Hai cực này đã có dây nối');render();return}
  const la=termOf(a).t.label.toUpperCase(),lb=termOf(ref).t.label.toUpperCase();
  let color=curColor;if(la==='PE'||lb==='PE')color='pe';else if(la==='N'||lb==='N')color='blue';
  record();const w={id:uid(),a,b:ref,color,size:'1.5',pts:drawing.pts.length?drawing.pts.map(p=>({...p})):null};
  S.wires.push(w);drawing=null;sel={kind:'wire',id:w.id};changed();log('wire',`W${S.wires.length} ${termName(a)} → ${termName(ref)}`)}
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k};drag=null;return}
  const W=toWorld(e);const el=e.target.closest('[data-term],[data-seg],[data-comp]');
  if(el&&el.dataset.term){const [c,t]=el.dataset.term.split(':');const ref={c,t};
    if(drawing)finishWire(ref);else{drawing={a:ref,pts:[],cur:W};render()}return}
  if(drawing){drag={kind:'bend',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false};return}
  if(el&&el.dataset.seg){const [id,j]=el.dataset.seg.split(':');const w=wireById(id);sel={kind:'wire',id};const full=wirePts(w);const i=+j;
    if(i>0&&i<full.length-2){record();w.pts=full.slice(1,-1).map(p=>({...p}));drag={kind:'seg',w,i:i-1,hz:full[i].y===full[i+1].y,sx:W.x,sy:W.y,o:{x:full[i].x,y:full[i].y},moved:false}}
    render();renderPanel();return}
  if(el&&el.dataset.comp){const c=compById(el.dataset.comp);sel={kind:'comp',id:c.id};drag={kind:'comp',c,ox:c.x,oy:c.y,sx:W.x,sy:W.y,moved:false,snap:JSON.stringify(S)};render();renderPanel();return}
  drag={kind:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false};
});
svg.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];zoomAt(pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);return}
  const W=toWorld(e);const sc=document.getElementById('stCur');if(sc)sc.textContent=`X ${String(snap(W.x)).padStart(4,' ')} · Y ${String(snap(W.y)).padStart(4,' ')}`;
  if(!drag){const el=e.target.closest('[data-term]');const k=el?el.dataset.term:null;
    const tip=document.getElementById('tip');
    if(k){const [c,t]=k.split(':');const r=svg.getBoundingClientRect(),b=document.getElementById('board').getBoundingClientRect();tip.hidden=false;tip.textContent=termName({c,t});tip.style.left=(e.clientX-b.left)+'px';tip.style.top=(e.clientY-b.top)+'px'}else tip.hidden=true;
    if(k!==hoverTerm){hoverTerm=k;render()}
    if(drawing){drawing.cur={x:snap(W.x),y:snap(W.y)};render()}return}
  if(drag.kind==='pan'||drag.kind==='bend'){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved){view.x=drag.vx-dx/view.k;view.y=drag.vy-dy/view.k;applyView()}return}
  if(drag.kind==='comp'){const nx=snap(drag.ox+W.x-drag.sx),ny=snap(drag.oy+W.y-drag.sy);if(nx!==drag.c.x||ny!==drag.c.y){drag.c.x=nx;drag.c.y=ny;drag.moved=true;render()}return}
  if(drag.kind==='seg'){const p=drag.w.pts;if(drag.hz){const y=snap(drag.o.y+W.y-drag.sy);p[drag.i].y=p[drag.i+1].y=y}else{const x=snap(drag.o.x+W.x-drag.sx);p[drag.i].x=p[drag.i+1].x=x}drag.moved=true;render()}
});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!drag)return;
  if(drag.kind==='bend'&&!drag.moved&&drawing){const W=toWorld(e);drawing.pts.push({x:snap(W.x),y:snap(W.y)});render()}
  if(drag.kind==='pan'&&!drag.moved&&sel){sel=null;render();renderPanel()}
  if(drag.kind==='comp'&&drag.moved){hist.push(drag.snap);fut=[];save();renderPanel()}
  if(drag.kind==='seg'){if(!drag.moved)hist.pop();save()}
  drag=null}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('pointerleave',()=>{document.getElementById('tip').hidden=true});
svg.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey)zoomAt(view.k*Math.exp(-e.deltaY*.01),e.clientX,e.clientY);else{view.x+=e.deltaX/view.k;view.y+=e.deltaY/view.k;applyView()}},{passive:false});
svg.addEventListener('dragover',e=>e.preventDefault());
svg.addEventListener('drop',e=>{e.preventDefault();const type=e.dataTransfer.getData('text/plain');if(!DEFS[type])return;const W=toWorld(e);const {w,h}=DEFS[type].size(DEFS[type].defaults);record();const c=addComp(type,W.x-w/2,W.y-h/2);sel={kind:'comp',id:c.id};changed();log('add',compLabel(c))});

function delSel(){if(!sel)return;const what=sel.kind==='comp'?compLabel(compById(sel.id)):'W'+(S.wires.indexOf(wireById(sel.id))+1)+' '+termName(wireById(sel.id).a);log('del',what);record();if(sel.kind==='comp'){S.comps=S.comps.filter(c=>c.id!==sel.id);S.wires=S.wires.filter(w=>w.a.c!==sel.id&&w.b.c!==sel.id)}else S.wires=S.wires.filter(w=>w.id!==sel.id);sel=null;changed()}
function dupSel(){if(!sel||sel.kind!=='comp')return;const c=compById(sel.id);record();const n=addComp(c.type,c.x+40,c.y+40,{...c.p,tag:undefined});n.p.tag=nextTag(c.type);sel={kind:'comp',id:n.id};changed();log('add',compLabel(n),'nhân bản')}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;
  const mod=e.ctrlKey||e.metaKey;
  if(e.key==='Escape'){if(drawing){drawing=null;render()}else if(sel){sel=null;render();renderPanel()}closeModal()}
  else if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();delSel()}
  else if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  else if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dupSel()}
  else if(sel&&sel.kind==='comp'&&e.key.startsWith('Arrow')){e.preventDefault();const c=compById(sel.id);record();const s=e.shiftKey?50:10;if(e.key==='ArrowLeft')c.x-=s;if(e.key==='ArrowRight')c.x+=s;if(e.key==='ArrowUp')c.y-=s;if(e.key==='ArrowDown')c.y+=s;changed()}
});

/* ---------- Thư viện ---------- */
function libThumb(type){const d=DEFS[type];const p={...d.defaults,tag:''};if(type==='rail'||type==='duct')p.len=200;const {w,h}=d.size(p);
  let s=d.draw(p);d.terms(p).forEach(t=>s+=`<circle cx="${t.x}" cy="${t.y}" r="8" fill="url(#gScrew)" stroke="#5f656b"/>`);
  return `<svg viewBox="-6 -6 ${w+12} ${h+12}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="color:var(--ink-2)">${s}</svg>`}
function renderLib(){const el=document.getElementById('libList');let s='';
  const used={};S.comps.forEach(c=>used[c.type]=(used[c.type]||0)+1);
  CATS.forEach(cat=>{const items=LIB_ORDER.filter(t=>DEFS[t].cat===cat);s+=`<h3><span>${cat}</span><span>${String(items.length).padStart(2,'0')}</span></h3>`+items.map(t=>{const d=DEFS[t],n=d.terms({...d.defaults}).length,u=used[t]||0;
    return `<button class="lib-item" draggable="true" data-add="${t}" type="button" title="Bấm để thêm · kéo thả vào bảng vẽ"><span class="th">${libThumb(t)}</span><span><b>${d.name}</b><small>${d.prefix?esc(d.prefix)+' · ':''}${n?n+' cực':'phụ kiện'}</small></span><span class="cnt${u?' on':''}">${u?'×'+u:''}</span></button>`}).join('')});
  el.innerHTML=`<svg width="0" height="0" style="position:absolute"><defs>${SVG_DEFS}</defs></svg>`+s;
  document.getElementById('libCount').textContent=LIB_ORDER.length+' mẫu';
  el.querySelectorAll('[data-add]').forEach(b=>{b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',b.dataset.add));
    b.addEventListener('click',()=>{const t=b.dataset.add,r=svg.getBoundingClientRect();const {w,h}=DEFS[t].size(DEFS[t].defaults);record();
      const c=addComp(t,view.x+r.width/view.k/2-w/2+(Math.random()*40-20),view.y+r.height/view.k/2-h/2+(Math.random()*40-20));sel={kind:'comp',id:c.id};closeDrawers();changed();log('add',compLabel(c))})})}

/* ---------- Chỉ số, dải tiến độ, thanh trạng thái ---------- */
function wireLen(w){const p=wirePts(w);if(!p)return 0;let L=0;for(let i=1;i<p.length;i++)L+=Math.abs(p[i].x-p[i-1].x)+Math.abs(p[i].y-p[i-1].y);return L}
let libSig='';
function renderMeta(){
  const used=new Set();S.wires.forEach(w=>{used.add(tkey(w.a));used.add(tkey(w.b))});
  const devs=S.comps.filter(c=>DEFS[c.type].prefix&&DEFS[c.type].terms(c.p).length);
  let tot=0,on=0;
  const cards=devs.map(c=>{const ts=DEFS[c.type].terms(c.p),n=ts.length,u=ts.filter(t=>used.has(c.id+':'+t.id)).length;tot+=n;on+=u;
    const segN=Math.min(n,16),f=n>16?Math.round(u/n*segN):u;
    const isOn=sel&&sel.kind==='comp'&&sel.id===c.id;
    return `<button class="card${isOn?' on':''}${u===n?' done':''}${u===0?' idle':''}" data-card="${c.id}" type="button" title="${esc(DEFS[c.type].name)} · ${u}/${n} cực đã đấu"><span class="hd"><span>${esc(c.p.tag||DEFS[c.type].name)}</span><em>${u===n?'✓':u+'/'+n}</em></span><span class="bar">${Array.from({length:segN},(_,i)=>`<i${i<f?' class="f"':''}></i>`).join('')}</span></button>`}).join('');
  const st=document.getElementById('strip');st.innerHTML=cards||'<span class="empty">Chưa có thiết bị nào có cực đấu. Thêm thiết bị từ thư viện bên trái.</span>';
  st.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const c=compById(b.dataset.card);if(!c)return;sel={kind:'comp',id:c.id};tab='props';
    const {w,h}=DEFS[c.type].size(c.p),r=svg.getBoundingClientRect();view.x=c.x+w/2-r.width/view.k/2;view.y=c.y+h/2-r.height/view.k/2;applyView();render();renderPanel()});
  const sOn=st.querySelector('.card.on');if(sOn)sOn.scrollIntoView({block:'nearest',inline:'nearest'});
  const m=S.wires.reduce((a,w)=>a+wireLen(w),0)/1000;
  document.getElementById('stDev').textContent=S.comps.filter(c=>DEFS[c.type].prefix).length;
  document.getElementById('stWire').textContent=S.wires.length;
  document.getElementById('stLen').innerHTML=`${m.toFixed(1)}<em> m</em>`;
  document.getElementById('stTerm').innerHTML=`${on}<em> / ${tot}</em>`;
  document.getElementById('bbInfo').textContent=`· ${tot?Math.round(on/tot*100):0}% đã đấu`;
  let ss='Chưa chọn · chạm thiết bị hoặc dây';
  if(sel&&sel.kind==='comp'&&compById(sel.id)){const c=compById(sel.id),i=S.comps.indexOf(c)+1;ss=`#${String(i).padStart(2,'0')} / ${S.comps.length}  <b>${esc(c.p.tag||'—')}</b>  ${esc(DEFS[c.type].name)}`}
  else if(sel&&sel.kind==='wire'&&wireById(sel.id)){const w=wireById(sel.id),i=S.wires.indexOf(w)+1;ss=`W${i} / ${S.wires.length}  <b>${esc(termName(w.a))} → ${esc(termName(w.b))}</b>  ${w.size} mm²`}
  document.getElementById('stSel').innerHTML=ss;
  const sig=S.comps.map(c=>c.type).sort().join();if(sig!==libSig){libSig=sig;renderLib()}
}

/* ---------- Bảng thuộc tính ---------- */
function field(id,label,inner){return `<div class="field"><label for="${id}">${label}</label>${inner}</div>`}
function renderPanel(){
  renderMeta();
  document.getElementById('nW').textContent=S.wires.length;document.getElementById('nC').textContent=S.comps.filter(c=>DEFS[c.type].prefix).length;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  const pane=document.getElementById('pane');
  if(tab==='wires'){pane.innerHTML=S.wires.length?`<h2>Bảng dây</h2><p class="sub">${S.wires.length} sợi · chạm một dòng để tìm dây trên bản vẽ</p><table><thead><tr><th>#</th><th>Từ → Đến</th><th>Màu</th><th>mm²</th></tr></thead><tbody>`+
      S.wires.map((w,i)=>`<tr class="click${sel&&sel.id===w.id?' on':''}" data-w="${w.id}"><td class="m">W${i+1}</td><td class="m">${esc(termName(w.a))}<br>→ ${esc(termName(w.b))}</td><td><span class="chip" style="background:${wc(w.color).c}"></span></td><td class="m">${w.size}</td></tr>`).join('')+'</tbody></table>'
      :`<h2>Bảng dây</h2><p class="empty">Chưa có dây nào. Chạm vào một ốc đấu trên thiết bị rồi chạm ốc thứ hai để nối.</p>`;
    pane.querySelectorAll('[data-w]').forEach(r=>r.onclick=()=>{sel={kind:'wire',id:r.dataset.w};render();renderPanel()});return}
  if(tab==='bom'){const g=new Map();S.comps.filter(c=>DEFS[c.type].prefix).forEach(c=>{const d=DEFS[c.type];const k=d.name+'|'+d.spec(c.p);const o=g.get(k)||{name:d.name,spec:d.spec(c.p),tags:[]};o.tags.push(c.p.tag||'–');g.set(k,o)});
    const len={};S.wires.forEach(w=>{const L=wireLen(w);if(!L)return;const k=wc(w.color).name.split(' (')[0]+' '+w.size+' mm²';len[k]=(len[k]||0)+L});
    pane.innerHTML=`<h2>Danh sách vật tư</h2><p class="sub">Tự tổng hợp từ bản vẽ</p>`+(g.size?`<table><thead><tr><th>SL</th><th>Thiết bị</th><th>Ký hiệu</th></tr></thead><tbody>`+[...g.values()].map(o=>`<tr><td class="m">${o.tags.length}</td><td><b>${esc(o.name)}</b><br><span style="color:var(--ink-3)">${esc(o.spec)}</span></td><td class="m">${esc(o.tags.join(', '))}</td></tr>`).join('')+'</tbody></table>':'<p class="empty">Chưa có thiết bị.</p>')+
      (Object.keys(len).length?`<h2 style="margin-top:20px">Dây dẫn</h2><p class="sub">Chiều dài ước tính theo bản vẽ, 10 px ≈ 1 cm</p><table><tbody>`+Object.entries(len).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="m" style="text-align:right">${(v/1000).toFixed(1)} m</td></tr>`).join('')+'</tbody></table>':'');return}
  if(sel&&sel.kind==='comp'){const c=compById(sel.id);if(!c){sel=null;return renderPanel()}const d=DEFS[c.type];
    let s=`<h2>${esc(d.name)}</h2><p class="sub">${esc(d.spec(c.p)||'Phụ kiện bố trí')}</p>`;
    if(d.prefix)s+=field('p-tag','Ký hiệu trên bản vẽ',`<input id="p-tag" data-k="tag" value="${esc(c.p.tag)}">`);
    d.props.forEach(pr=>{const id='p-'+pr.k,v=c.p[pr.k];
      if(pr.t==='select')s+=field(id,pr.l,`<select id="${id}" data-k="${pr.k}">${pr.o.map(([val,lab])=>`<option value="${esc(val)}"${String(v)===String(val)?' selected':''}>${esc(lab)}</option>`).join('')}</select>`);
      else if(pr.t==='area')s+=field(id,pr.l,`<textarea id="${id}" data-k="${pr.k}">${esc(v)}</textarea>`);
      else s+=field(id,pr.l,`<input id="${id}" data-k="${pr.k}" ${pr.t==='number'?'type="number" step="10" min="60"':''} value="${esc(v)}">`)});
    const ts=d.terms(c.p);if(ts.length){const used=new Set();S.wires.forEach(w=>{used.add(tkey(w.a));used.add(tkey(w.b))});
      s+=`<div class="field"><label>Cực đấu (đỏ = đã có dây)</label></div><div class="terms">`+ts.map(t=>`<span class="${used.has(c.id+':'+t.id)?'on':''}">${esc(t.label)}</span>`).join('')+'</div>'}
    s+=`<div class="row"><button class="btn" id="pDup" type="button">Nhân bản</button><button class="btn danger" id="pDel" type="button">Xóa thiết bị</button></div>`;
    pane.innerHTML=s;
    pane.querySelectorAll('[data-k]').forEach(inp=>{let rec=false;const apply=()=>{if(!rec){record();rec=true}c.p[inp.dataset.k]=inp.value;cleanup();save();render();pane.querySelector('.sub').textContent=d.spec(c.p)||'Phụ kiện bố trí'};
      inp.addEventListener(inp.tagName==='SELECT'?'change':'input',apply);inp.addEventListener('blur',()=>{rec=false;renderPanel()})});
    document.getElementById('pDup').onclick=dupSel;document.getElementById('pDel').onclick=delSel;return}
  if(sel&&sel.kind==='wire'){const w=wireById(sel.id);if(!w){sel=null;return renderPanel()}const idx=S.wires.indexOf(w)+1;
    pane.innerHTML=`<h2>Dây W${idx}</h2><p class="sub">${esc(termName(w.a))} → ${esc(termName(w.b))}</p>
      <div class="field"><label>Màu dây</label></div><div class="row" style="margin-bottom:14px;gap:6px">${WIRES.map(c=>`<button class="sw${w.color===c.id?' on':''}" style="background:${c.s?`repeating-linear-gradient(45deg,${c.c} 0 5px,${c.s} 5px 10px)`:c.c}" data-c="${c.id}" title="${c.name}" aria-label="${c.name}" type="button"></button>`).join('')}</div>`+
      field('w-size','Tiết diện (mm²)',`<select id="w-size">${SIZES.map(v=>`<option${w.size===v?' selected':''}>${v}</option>`).join('')}</select>`)+
      `<div class="row"><button class="btn" id="wAuto" type="button">Đi lại dây tự động</button><button class="btn danger" id="wDel" type="button">Xóa dây</button></div>`;
    pane.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{record();w.color=b.dataset.c;curColor=w.color;renderSwatches();changed()});
    document.getElementById('w-size').onchange=e=>{record();w.size=e.target.value;changed()};
    document.getElementById('wAuto').onclick=()=>{record();w.pts=null;changed()};document.getElementById('wDel').onclick=delSel;return}
  pane.innerHTML=`<h2>Cách dùng</h2><p class="sub">Vẽ sơ đồ lắp đặt giống mặt tủ thật</p><ol class="guide">
    <li><b>Thêm thiết bị:</b> bấm vào ô thiết bị ở cột trái (hoặc kéo thả vào bảng vẽ).</li>
    <li><b>Sắp xếp:</b> kéo thân thiết bị để di chuyển, bám lưới 10 px. Phím mũi tên để dịch từng bước.</li>
    <li><b>Nối dây:</b> chạm vào ốc đấu thứ nhất, sau đó chạm ốc đấu thứ hai. Chạm vào nền ở giữa để thêm điểm gấp.</li>
    <li><b>Chọn màu dây</b> ở thanh trên trước khi nối. Cực N tự chọn xanh dương, cực PE tự chọn vàng-xanh.</li>
    <li><b>Chỉnh đường dây:</b> chọn dây, kéo các nút tròn trên từng đoạn.</li>
    <li><b>Kiểm tra mạch:</b> rê chuột lên một ốc đấu, mọi dây cùng điện thế sẽ sáng lên.</li>
    <li><b>Xuất bản vẽ</b> ra ảnh PNG hoặc mã SVG để dán vào Figma / Illustrator.</li></ol>
    <div class="legend">${WIRES.map(c=>`<i style="background:${c.s?`repeating-linear-gradient(45deg,${c.c} 0 5px,${c.s} 5px 10px)`:c.c}"></i><span>${c.name}</span>`).join('')}</div>
    <p class="sub" style="margin-top:16px">Phím tắt: <kbd>Del</kbd> xóa · <kbd>Ctrl</kbd>+<kbd>Z</kbd> hoàn tác · <kbd>Ctrl</kbd>+<kbd>D</kbd> nhân bản · <kbd>Esc</kbd> hủy dây · <kbd>Ctrl</kbd>+cuộn để phóng to</p>`}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;renderPanel()});

function renderSwatches(){const el=document.getElementById('swatches');el.innerHTML='<span class="lbl">Màu</span>'+WIRES.map(c=>`<button class="sw${curColor===c.id?' on':''}" style="background:${c.s?`repeating-linear-gradient(45deg,${c.c} 0 5px,${c.s} 5px 10px)`:c.c}" data-c="${c.id}" title="${c.name}" aria-label="${c.name}" type="button"></button>`).join('');
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{curColor=b.dataset.c;if(sel&&sel.kind==='wire'){record();wireById(sel.id).color=curColor;changed()}renderSwatches();render()})}

/* ---------- Xuất / lưu ---------- */
function exportSvg(){const b=bbox();let body='';
  [...S.comps].sort((a,c)=>(DEFS[a.type].layer??1)-(DEFS[c.type].layer??1)).filter(c=>(DEFS[c.type].layer??1)<2).forEach(c=>body+=compSvg(c,true));
  S.wires.forEach(w=>{const p=wirePts(w);if(p)body+=wireSvg(p,wc(w.color),w.size)+ferrule({...p[0],d:termWorld(w.a).d},w.size)+ferrule({...p[p.length-1],d:termWorld(w.b).d},w.size)});
  S.comps.filter(c=>DEFS[c.type].layer===2).forEach(c=>body+=compSvg(c,true));
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${b.w}" height="${b.h}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}" style="color:#3a434d"><defs>${SVG_DEFS}</defs><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="#ffffff"/>${body}</svg>`}
function modal(html){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal" id="mBg"><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`;document.getElementById('mBg').addEventListener('pointerdown',e=>{if(e.target.id==='mBg')closeModal()});root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function copyFrom(ta){const v=ta.value;navigator.clipboard.writeText(v).then(()=>toast('Đã sao chép'),()=>{ta.focus();ta.select();toast('Đã chọn sẵn, nhấn Ctrl+C để sao chép')})}
document.getElementById('bExport').onclick=()=>{const code=exportSvg();log('sys','Xuất bản vẽ PNG / SVG','xuất');
  modal(`<header><h2>Xuất bản vẽ</h2><p>Ảnh PNG: nhấn giữ (điện thoại) hoặc chuột phải → <b>Lưu hình ảnh</b>. Mã SVG: bấm <b>Sao chép SVG</b> rồi dán thẳng vào Figma hoặc Illustrator để có hình vector chỉnh tiếp.</p></header>
    <div class="body"><div id="pngBox" class="empty">Đang tạo ảnh…</div><textarea id="svgCode" readonly style="height:110px;margin-top:10px">${esc(code)}</textarea></div>
    <footer><button class="btn" data-close type="button">Đóng</button><button class="btn primary" id="cpSvg" type="button">Sao chép SVG</button></footer>`);
  document.getElementById('cpSvg').onclick=()=>copyFrom(document.getElementById('svgCode'));
  const img=new Image();const b=bbox();const scale=2;img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=b.w*scale;cv.height=b.h*scale;const cx=cv.getContext('2d');cx.scale(scale,scale);cx.drawImage(img,0,0,b.w,b.h);
      document.getElementById('pngBox').innerHTML=`<img alt="Sơ đồ đấu nối" src="${cv.toDataURL('image/png')}">`}catch(e){document.getElementById('pngBox').innerHTML='';document.getElementById('pngBox').appendChild(img)}};
  img.onerror=()=>{document.getElementById('pngBox').textContent='Trình duyệt không tạo được ảnh, hãy dùng mã SVG bên dưới.'};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(code)};
document.getElementById('bData').onclick=()=>{modal(`<header><h2>Lưu / Mở bản vẽ</h2><p>Bản vẽ tự lưu trong trình duyệt này. Để mang sang máy khác: sao chép đoạn dữ liệu, dán vào ghi chú hoặc tệp .txt; khi cần mở lại thì dán vào ô và bấm <b>Mở dữ liệu này</b>.</p></header>
  <div class="body"><textarea id="jsonBox" spellcheck="false">${esc(JSON.stringify(S))}</textarea></div>
  <footer><button class="btn" data-close type="button">Đóng</button><button class="btn" id="jCopy" type="button">Sao chép dữ liệu</button><button class="btn primary" id="jLoad" type="button">Mở dữ liệu này</button></footer>`);
  document.getElementById('jCopy').onclick=()=>copyFrom(document.getElementById('jsonBox'));
  document.getElementById('jLoad').onclick=()=>{try{const d=JSON.parse(document.getElementById('jsonBox').value);if(!Array.isArray(d.comps)||!Array.isArray(d.wires))throw 0;d.comps=d.comps.filter(c=>DEFS[c.type]);record();S=d;sel=null;drawing=null;changed();closeModal();fit();toast('Đã mở bản vẽ');log('sys',`Mở dữ liệu · ${S.comps.length} khối · ${S.wires.length} dây`)}catch(e){toast('Dữ liệu không đúng định dạng, hãy dán lại toàn bộ đoạn đã sao chép')}}};
document.getElementById('bNew').onclick=()=>{modal(`<header><h2>Bắt đầu trang trắng?</h2><p>Toàn bộ thiết bị và dây hiện tại sẽ bị xóa. Bạn vẫn có thể bấm Hoàn tác để lấy lại.</p></header><footer><button class="btn" data-close type="button">Giữ bản vẽ</button><button class="btn primary" id="okNew" type="button">Xóa và làm mới</button></footer>`);
  document.getElementById('okNew').onclick=()=>{record();S={comps:[],wires:[]};sel=null;drawing=null;changed();closeModal();view={x:-40,y:-40,k:1};applyView();log('del','Trang trắng · xóa toàn bộ')}};
function loadExample(fn,msg){record();S=fn();sel=null;drawing=null;changed();fit();closeModal();toast(msg);log('sys',msg.replace('Đã nạp ','Nạp '))}
document.getElementById('bExample').onclick=()=>{modal(`<header><h2>Chọn mạch mẫu</h2><p>Mạch mẫu thay cho bản vẽ hiện tại. Bấm Hoàn tác nếu muốn quay lại.</p></header>
  <div class="body"><div class="row"><button class="btn ex" id="exRmu" type="button"><b>Tủ RMU 24 kV – 3 ngăn</b><span>2 ngăn cầu dao phụ tải + 1 ngăn bảo vệ MBA, cáp, FPI, tiếp địa</span></button>
  <button class="btn ex" id="exMotor" type="button"><b>Khởi động động cơ bằng PLC</b><span>Aptomat, khởi động từ, rơ le nhiệt, nút nhấn, đèn báo</span></button></div></div>
  <footer><button class="btn" data-close type="button">Đóng</button></footer>`);
  document.getElementById('exRmu').onclick=()=>loadExample(exampleRMU,'Đã nạp mạch mẫu tủ RMU 3 ngăn');
