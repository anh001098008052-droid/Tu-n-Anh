<title>Bản đồ Phủ Lý</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-height app — side panel (desktop) / bottom sheet (phone) + canvas map. Map palette follows street-map conventions: blue water, green parks, amber arterials, teal route. */
:root{
  --panel:#ffffff; --ink:#1c2430; --muted:#5b6676; --line:#e2e5e9; --chip:#f2f4f6;
  --land:#eef0eb; --block:#e6e8e2; --park:#d3e6c6; --water:#a7cbe9; --water-ink:#356a97;
  --road:#ffffff; --road-case:#cdd2d8; --major:#fde3a1; --major-case:#dcb258;
  --trunk:#f7b56a; --trunk-case:#cf8538; --rail:#868c95;
  --label:#384150; --halo:#ffffff;
  --accent:#0e8a6b; --accent-soft:#d9f1ea; --accent-ink:#ffffff; --route-case:#0a5f4a;
  --start:#1c7ed6; --end:#d6336c;
  --shadow:0 2px 10px rgba(20,30,40,.14);
  --font:"Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --panel:#15191e; --ink:#e7eaee; --muted:#9aa4b1; --line:#2a3038; --chip:#1f252c;
  --land:#1b1f24; --block:#20252b; --park:#1e3326; --water:#173149; --water-ink:#86b6de;
  --road:#3a414a; --road-case:#252a30; --major:#6a5a30; --major-case:#3b331f;
  --trunk:#8b5b2b; --trunk-case:#4b3119; --rail:#6d737c;
  --label:#d5dae1; --halo:#1b1f24;
  --accent:#2bc59a; --accent-soft:#163b31; --accent-ink:#0b1f19; --route-case:#0d4a3a;
  --start:#4dabf7; --end:#f06595;
  --shadow:0 2px 12px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --panel:#15191e; --ink:#e7eaee; --muted:#9aa4b1; --line:#2a3038; --chip:#1f252c;
  --land:#1b1f24; --block:#20252b; --park:#1e3326; --water:#173149; --water-ink:#86b6de;
  --road:#3a414a; --road-case:#252a30; --major:#6a5a30; --major-case:#3b331f;
  --trunk:#8b5b2b; --trunk-case:#4b3119; --rail:#6d737c;
  --label:#d5dae1; --halo:#1b1f24;
  --accent:#2bc59a; --accent-soft:#163b31; --accent-ink:#0b1f19; --route-case:#0d4a3a;
  --start:#4dabf7; --end:#f06595;
  --shadow:0 2px 12px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden}
.app{display:grid;grid-template-columns:360px 1fr;height:100%}
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line);background:var(--panel);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:16px;padding-block:16px 0;gap:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px 12px 10px 36px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--panel)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{flex:1;font:inherit;font-weight:600;font-size:13px;border:0;background:transparent;color:var(--muted);padding:7px 0;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.list{flex:1;min-height:0;overflow:auto;margin:0 -16px 0 0;padding:0 16px 16px 0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit}
.item:hover,.item:focus-visible{background:var(--chip);outline:none}
.item .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.item b{display:block;font-weight:600;font-size:14px;line-height:1.35}
.item span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.empty{color:var(--muted);padding:16px 4px;line-height:1.5}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h2{font-size:16px;margin:0;line-height:1.35}
.card .meta{color:var(--muted);font-size:12.5px;line-height:1.5}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:8px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.chip:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.field .pin{width:12px;height:12px;border-radius:50%}
.field .v{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field .v.ph{color:var(--muted);font-weight:400}
.field.picking{outline:2px solid var(--accent)}
.sum{display:flex;gap:16px;align-items:baseline;padding:4px 2px}
.sum strong{font-size:22px;font-variant-numeric:tabular-nums}
.sum span{color:var(--muted)}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.step em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:11.5px;line-height:1.5;padding:8px 0 calc(12px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line)}
.mapwrap{position:relative;min-width:0;min-height:0;background:var(--land);overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
canvas.pick{cursor:crosshair}
.ctrl{position:absolute;right:max(12px, env(safe-area-inset-right, 0px));top:12px;display:flex;flex-direction:column;gap:6px}
.ctrl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:18px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center}
.scale{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--label);font-weight:600}
.scale div{height:5px;border:2px solid var(--label);border-top:0;margin-top:2px}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 120px);text-align:center}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .mapwrap{grid-row:1}
  .panel{grid-row:2;border-right:0;border-top:1px solid var(--line);max-height:46vh;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:12px;gap:10px}
  .panel{overflow-y:auto}
  .panel>*{flex-shrink:0}
  #view-find,#view-route{flex:none!important}
  .list{overflow:visible;flex:none}
  .panel.collapsed .hide-c{display:none!important}
  .brand h1{font-size:17px}
  .grab{display:block!important}
}
.grab{display:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 0;border:0;padding:0;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="panel" id="panel">
    <button class="grab" id="grab" aria-label="Thu gọn / mở rộng bảng"></button>
    <div class="brand"><h1>Bản đồ Phủ Lý</h1><small>Ninh Bình (trước là Hà Nam)</small></div>
    <label class="search hide-c">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Tìm cơ quan, khách sạn, tên đường…" autocomplete="off" aria-label="Tìm kiếm">
    </label>
    <div class="tabs hide-c" role="tablist">
      <button role="tab" id="tab-find" aria-selected="true">Địa điểm</button>
      <button role="tab" id="tab-route" aria-selected="false">Chỉ đường</button>
    </div>
    <div id="view-find" class="hide-c" style="display:flex;flex-direction:column;gap:12px;min-height:0;flex:1">
      <div class="chips" id="chips"></div>
      <div id="sel"></div>
      <div class="list" id="list"></div>
    </div>
    <div id="view-route" class="hide-c" hidden style="flex-direction:column;gap:10px;min-height:0;flex:1">
      <div class="field" id="f-a"><i class="pin" style="background:var(--start)"></i><div class="v ph" id="v-a">Chọn điểm đi</div><button class="btn" id="pick-a">Chọn trên bản đồ</button></div>
      <div class="field" id="f-b"><i class="pin" style="background:var(--end)"></i><div class="v ph" id="v-b">Chọn điểm đến</div><button class="btn" id="pick-b">Chọn trên bản đồ</button></div>
      <div class="row"><button class="btn" id="swap">Đảo chiều</button><button class="btn" id="clear">Xoá tuyến</button></div>
      <div id="route-out" class="list" style="gap:6px"></div>
    </div>
    <div class="foot hide-c">Dữ liệu đường phố © OpenStreetMap contributors (ODbL), tải ngày 23/11/2026. Thời gian đi là ước tính theo loại đường; khi chạy thực tế, bấm “Dẫn đường bằng Google Maps” để có tình trạng giao thông.</div>
  </aside>
  <main class="mapwrap" id="wrap">
    <canvas id="map" aria-label="Bản đồ khu vực Phủ Lý"></canvas>
    <div class="ctrl">
      <button id="zin" aria-label="Phóng to">+</button>
      <button id="zout" aria-label="Thu nhỏ">−</button>
      <button id="home" aria-label="Về trung tâm Phủ Lý" style="font-size:14px">⌂</button>
    </div>
    <div class="scale" id="scale"><span></span><div></div></div>
    <div class="toast" id="toast" hidden></div>
    <div class="loading" id="loading">Đang tải bản đồ…</div>
  </main>
</div>

<script>
(async function(){
const CATS = {
  gov:    {name:'Cơ quan',      color:'#b4532a', ch:'CQ'},
  health: {name:'Bệnh viện',    color:'#d6336c', ch:'+'},
  hotel:  {name:'Khách sạn',    color:'#7048e8', ch:'KS'},
  transit:{name:'Ga, bến xe',   color:'#1c7ed6', ch:'G'},
  bank:   {name:'Ngân hàng',    color:'#0b7285', ch:'₫'},
  fuel:   {name:'Cây xăng',     color:'#5c940d', ch:'X'},
  edu:    {name:'Trường học',   color:'#e67700', ch:'T'},
  shop:   {name:'Chợ, siêu thị',color:'#ae3ec9', ch:'C'},
  sight:  {name:'Đền, chùa, công viên', color:'#5f6b7a', ch:'•'},
};
const SPEED = [60,45,35,30,25,20,12];            // km/h by road class, for ETA
const WIDTH = [24,22,18,14,11,8,6];              // road width in metres
const MINPX = [3,3,2.6,2,1.4,.8,.6];             // minimum drawn width in px
const SHOW  = [0,0,0,0.035,0.06,0.09,0.25];      // px-per-metre at which class appears
const LAT0 = 20.5455, LON0 = 105.9135;
const KX = 111320*Math.cos(LAT0*Math.PI/180), KY = 110574;

const $ = id => document.getElementById(id);
const cv = $('map'), ctx = cv.getContext('2d'), wrap = $('wrap');
let D;
try { D = await fetch('data.json').then(r => { if(!r.ok) throw 0; return r.json(); }); }
catch(e){ $('loading').textContent = 'Không tải được dữ liệu bản đồ. Hãy tải lại trang.'; return; }
const Q = D.q;

/* ---------- decode geometry into projected metres ---------- */
function dec(a){
  const n = a.length/2, out = new Float64Array(a.length), ints = new Int32Array(a.length);
  let x=0,y=0;
  for(let i=0;i<n;i++){ x+=a[2*i]; y+=a[2*i+1]; ints[2*i]=x; ints[2*i+1]=y;
    out[2*i]=(x/Q-LON0)*KX; out[2*i+1]=-(y/Q-LAT0)*KY; }
  return {p:out, ints};
}
const proj = (lon,lat) => [(lon-LON0)*KX, -(lat-LAT0)*KY];
const unproj = (x,y) => [x/KX+LON0, -y/KY+LAT0];

function pathOf(p, close){
  const P = new Path2D(); P.moveTo(p[0],p[1]);
  for(let i=2;i<p.length;i+=2) P.lineTo(p[i],p[i+1]);
  if(close) P.closePath(); return P;
}
const roads = D.roads.map(([c,name,ref,fl,g]) => { const d = dec(g); return {c,name,ref,oneway:fl&1,bridge:fl&2,p:d.p,ints:d.ints}; });
const classPaths = Array.from({length:7}, () => new Path2D());
const bridgePaths = Array.from({length:7}, () => new Path2D());
for(const r of roads){ (r.bridge?bridgePaths:classPaths)[r.c].addPath(pathOf(r.p)); }
const waterPath = new Path2D(); D.water.forEach(([n,g]) => waterPath.addPath(pathOf(dec(g).p, true)));
const parkPath = new Path2D(); D.parks.forEach(([n,g]) => parkPath.addPath(pathOf(dec(g).p, true)));
const riverPaths = [new Path2D(), new Path2D()]; D.rivers.forEach(([big,n,g]) => riverPaths[big].addPath(pathOf(dec(g).p)));
const railPath = new Path2D(); D.rail.forEach(g => railPath.addPath(pathOf(dec(g).p)));
const pois = D.pois.map(([cat,name,x,y,addr,phone,hours],i) => {
  const lon=x/Q, lat=y/Q, [px,py]=proj(lon,lat); return {i,cat,name,lon,lat,x:px,y:py,addr,phone,hours};
});

/* ---------- label candidates: longest straight run per named road ---------- */
const labelCands = [];
for(const r of roads){
  if(!r.name) continue;
  let best=-1, bl=0;
  for(let i=0;i<r.p.length-2;i+=2){ const l=Math.hypot(r.p[i+2]-r.p[i], r.p[i+3]-r.p[i+1]); if(l>bl){bl=l;best=i;} }
  if(best<0) continue;
  labelCands.push({c:r.c, name:r.name, len:bl, x:(r.p[best]+r.p[best+2])/2, y:(r.p[best+1]+r.p[best+3])/2,
    a:Math.atan2(r.p[best+3]-r.p[best+1], r.p[best+2]-r.p[best])});
}
labelCands.sort((a,b)=>a.c-b.c || b.len-a.len);
const waterLabels = [];
D.rivers.forEach(([big,n,g])=>{ if(!n||!big) return; const p=dec(g).p; const m=Math.floor(p.length/4)*2; if(p.length>=4) waterLabels.push({name:n,x:p[m],y:p[m+1],a:Math.atan2(p[m+3]-p[m+1],p[m+2]-p[m])}); });
D.water.forEach(([n,g])=>{ if(!n) return; const p=dec(g).p; let sx=0,sy=0; for(let i=0;i<p.length;i+=2){sx+=p[i];sy+=p[i+1];} waterLabels.push({name:n,x:sx/(p.length/2),y:sy/(p.length/2),a:0,area:true}); });

/* ---------- routing graph ---------- */
const nodeIdx = new Map(), NX=[], NY=[], adj=[];
function nid(ix,iy,x,y){ const k=ix*1e7+iy; let id=nodeIdx.get(k); if(id===undefined){ id=NX.length; nodeIdx.set(k,id); NX.push(x); NY.push(y); adj.push([]);} return id; }
roads.forEach((r,ri)=>{
  const sp = SPEED[r.c]/3.6;
  let prev = nid(r.ints[0],r.ints[1],r.p[0],r.p[1]);
  for(let i=2;i<r.p.length;i+=2){
    const cur = nid(r.ints[i],r.ints[i+1],r.p[i],r.p[i+1]);
    const len = Math.hypot(r.p[i]-r.p[i-2], r.p[i+1]-r.p[i-1]);
    adj[prev].push(cur, len, len/sp, ri);
    if(!r.oneway) adj[cur].push(prev, len, len/sp, ri);
    prev = cur;
  }
});
function nearestNode(x,y){ let b=-1,bd=Infinity; for(let i=0;i<NX.length;i++){ if(!adj[i].length) continue; const d=(NX[i]-x)**2+(NY[i]-y)**2; if(d<bd){bd=d;b=i;} } return b; }
function dijkstra(s,t){
  const n=NX.length, dist=new Float64Array(n).fill(Infinity), prev=new Int32Array(n).fill(-1), via=new Int32Array(n).fill(-1), vlen=new Float64Array(n);
  const H=[]; const push=(d,v)=>{H.push([d,v]); let i=H.length-1; while(i>0){const p=(i-1)>>1; if(H[p][0]<=H[i][0])break; [H[p],H[i]]=[H[i],H[p]]; i=p;}};
  const pop=()=>{const top=H[0], last=H.pop(); if(H.length){H[0]=last; let i=0; for(;;){const l=2*i+1,r=l+1; let m=i; if(l<H.length&&H[l][0]<H[m][0])m=l; if(r<H.length&&H[r][0]<H[m][0])m=r; if(m===i)break; [H[m],H[i]]=[H[i],H[m]]; i=m;}} return top;};
  dist[s]=0; push(0,s);
  while(H.length){ const [d,u]=pop(); if(u===t) break; if(d>dist[u]) continue; const a=adj[u];
    for(let k=0;k<a.length;k+=4){ const v=a[k], nd=d+a[k+2]; if(nd<dist[v]){dist[v]=nd; prev[v]=u; via[v]=a[k+3]; vlen[v]=a[k+1]; push(nd,v);} } }
  if(!isFinite(dist[t])) return null;
  const nodes=[], steps=[]; let len=0;
  for(let v=t; v!==-1; v=prev[v]){ nodes.push(v); if(prev[v]!==-1){ len+=vlen[v]; const r=roads[via[v]]; const nm=r.name||'Đường không tên'; if(steps.length&&steps[steps.length-1].name===nm) steps[steps.length-1].len+=vlen[v]; else steps.push({name:nm,len:vlen[v]}); } }
  nodes.reverse(); steps.reverse();
  return {nodes, len, time:dist[t], steps};
}

/* ---------- view state ---------- */
const view = {cx:0, cy:0, s:0.1};
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2.5); W=wrap.clientWidth; H=wrap.clientHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); draw(); }
function home(){ view.cx=0; view.cy=200; view.s=Math.min(W,H)/5200; draw(); }
const S2W = (sx,sy) => [(sx-W/2)/view.s+view.cx, (sy-H/2)/view.s+view.cy];
const W2S = (x,y) => [(x-view.cx)*view.s+W/2, (y-view.cy)*view.s+H/2];
function zoomAt(f, sx, sy){ const [wx,wy]=S2W(sx,sy); view.s=Math.max(0.012,Math.min(view.s*f,12)); view.cx=wx-(sx-W/2)/view.s; view.cy=wy-(sy-H/2)/view.s; draw(); }

let theme = {};
function readTheme(){ const cs=getComputedStyle(document.documentElement); for(const k of ['land','park','water','water-ink','road','road-case','major','major-case','trunk','trunk-case','rail','label','halo','accent','route-case','start','end']) theme[k]=cs.getPropertyValue('--'+k).trim(); }

/* ---------- state ---------- */
let filter = new Set(Object.keys(CATS)), selected = null, highlightRoad = null;
let route = null, A = null, B = null, picking = null;

/* ---------- draw ---------- */
let raf = 0;
function draw(){ if(!raf) raf=requestAnimationFrame(render); }
function render(){
  raf=0; if(!W) return;
  const s=view.s;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=theme.land; ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*s,0,0,DPR*s,DPR*(W/2-view.cx*s),DPR*(H/2-view.cy*s));
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.fillStyle=theme.park; ctx.fill(parkPath);
  ctx.fillStyle=theme.water; ctx.fill(waterPath,'evenodd');
  ctx.strokeStyle=theme.water;
  ctx.lineWidth=Math.max(3/s,55); ctx.stroke(riverPaths[1]);
  ctx.lineWidth=Math.max(1.4/s,10); ctx.stroke(riverPaths[0]);
  // rail
  ctx.strokeStyle=theme.rail; ctx.lineWidth=3/s; ctx.setLineDash([]); ctx.stroke(railPath);
  ctx.strokeStyle=theme.land; ctx.lineWidth=1.6/s; ctx.setLineDash([6/s,6/s]); ctx.stroke(railPath); ctx.setLineDash([]);
  // roads: casings then fills, minor first
  const fillOf = c => c<=1?theme.trunk : c<=3?theme.major : theme.road;
  const caseOf = c => c<=1?theme['trunk-case'] : c<=3?theme['major-case'] : theme['road-case'];
  const pass = (paths) => {
    for(let c=6;c>=0;c--){ if(s<SHOW[c]) continue; const w=Math.max(MINPX[c]/s, WIDTH[c]);
      ctx.strokeStyle=caseOf(c); ctx.lineWidth=w+Math.max(1.6/s, w*.22); ctx.stroke(paths[c]); }
    for(let c=6;c>=0;c--){ if(s<SHOW[c]) continue; const w=Math.max(MINPX[c]/s, WIDTH[c]);
      ctx.strokeStyle=fillOf(c); ctx.lineWidth=w; ctx.stroke(paths[c]); }
  };
  pass(classPaths); pass(bridgePaths);
  if(highlightRoad){ ctx.strokeStyle=theme.accent; ctx.globalAlpha=.55; ctx.lineWidth=Math.max(7/s,30); ctx.stroke(highlightRoad.path); ctx.globalAlpha=1; }
  // route
  if(route){
    const P=new Path2D(); route.nodes.forEach((n,i)=> i?P.lineTo(NX[n],NY[n]):P.moveTo(NX[n],NY[n]));
    ctx.strokeStyle=theme['route-case']; ctx.lineWidth=9/s; ctx.stroke(P);
    ctx.strokeStyle=theme.accent; ctx.lineWidth=6/s; ctx.stroke(P);
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawLabels();
  drawPois();
  [[A,theme.start,'A'],[B,theme.end,'B']].forEach(([p,col,t])=>{ if(!p) return; const [x,y]=W2S(p.x,p.y); pin(x,y,col,t); });
  updateScale();
}
function pin(x,y,col,t){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle=col; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-4,-8,-11,-12,-11,-20); ctx.arc(0,-20,11,Math.PI,0); ctx.bezierCurveTo(11,-12,4,-8,0,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='700 11px '+getFont(); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,0,-20);
  ctx.restore();
}
let fontName='"Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif';
const getFont=()=>fontName;
function drawLabels(){
  const s=view.s, boxes=[], used=new Set();
  const hit=(b)=>{ for(const o of boxes) if(b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]) return true; return false; };
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  // water names
  ctx.font='italic 500 12px '+getFont();
  for(const w of waterLabels){ if(s<0.05 || used.has(w.name)) continue; const [x,y]=W2S(w.x,w.y); if(x<0||y<0||x>W||y>H) continue;
    let a=w.a; if(a>Math.PI/2)a-=Math.PI; if(a<-Math.PI/2)a+=Math.PI;
    const tw=ctx.measureText(w.name).width, r=tw/2+4; const b=[x-r,y-r*Math.abs(Math.sin(a))-8,x+r,y+r*Math.abs(Math.sin(a))+8]; if(hit(b)) continue;
    boxes.push(b); used.add(w.name); ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.fillStyle=theme['water-ink']; ctx.fillText(w.name,0,0); ctx.restore(); }
  let count=0;
  for(const L of labelCands){
    if(s<SHOW[L.c]*1.6 || used.has(L.name) || count>90) continue;
    const [x,y]=W2S(L.x,L.y); if(x<-50||y<-20||x>W+50||y>H+20) continue;
    const size = L.c<=2?12.5:L.c<=4?11.5:10.5;
    ctx.font=(L.c<=3?'600 ':'500 ')+size+'px '+getFont();
    const tw=ctx.measureText(L.name).width;
    if(L.len*s < tw+6) continue;
    let a=L.a; if(a>Math.PI/2)a-=Math.PI; if(a<-Math.PI/2)a+=Math.PI;
    const hw=Math.abs(Math.cos(a))*tw/2+Math.abs(Math.sin(a))*7, hh=Math.abs(Math.sin(a))*tw/2+Math.abs(Math.cos(a))*7;
    const b=[x-hw-2,y-hh-2,x+hw+2,y+hh+2]; if(hit(b)) continue;
    boxes.push(b); used.add(L.name); count++;
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ctx.strokeStyle=theme.halo; ctx.lineWidth=3.5; ctx.strokeText(L.name,0,0.5);
    ctx.fillStyle=theme.label; ctx.fillText(L.name,0,0.5); ctx.restore();
  }
  labelBoxes=boxes;
}
let labelBoxes=[];
function poiVisible(p){ return filter.has(p.cat); }
function drawPois(){
  const s=view.s; const showLabel = s>0.35; const rad = s>0.2?8:s>0.08?5.5:3.5;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  const boxes=labelBoxes.slice();
  for(const p of pois){
    if(!poiVisible(p) || p===selected) continue;
    const [x,y]=W2S(p.x,p.y); if(x<-10||y<-10||x>W+10||y>H+10) continue;
    ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.fillStyle=CATS[p.cat].color; ctx.fill(); ctx.lineWidth=1.6; ctx.strokeStyle='#fff'; ctx.stroke();
    if(rad>=8){ ctx.fillStyle='#fff'; ctx.font='700 8px '+getFont(); ctx.textAlign='center'; ctx.fillText(CATS[p.cat].ch,x,y+.5); ctx.textAlign='left'; }
    if(showLabel){ ctx.font='500 11.5px '+getFont(); const tw=ctx.measureText(p.name).width; const b=[x+rad+3,y-8,x+rad+5+tw,y+8];
      let clash=false; for(const o of boxes) if(b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]){clash=true;break;}
      if(!clash){ boxes.push(b); ctx.strokeStyle=theme.halo; ctx.lineWidth=3; ctx.strokeText(p.name,x+rad+4,y); ctx.fillStyle=theme.label; ctx.fillText(p.name,x+rad+4,y); } }
  }
  if(selected){ const [x,y]=W2S(selected.x,selected.y); pin(x,y,CATS[selected.cat].color,CATS[selected.cat].ch);
    ctx.font='600 13px '+getFont(); ctx.textAlign='center'; ctx.strokeStyle=theme.halo; ctx.lineWidth=3.5; ctx.strokeText(selected.name,x,y+14); ctx.fillStyle=theme.label; ctx.fillText(selected.name,x,y+14); }
}
function updateScale(){
  const target=110/view.s; const pow=10**Math.floor(Math.log10(target)); let v=pow; for(const m of [1,2,5]) if(m*pow<=target) v=m*pow;
  const el=$('scale'); el.querySelector('span').textContent = v>=1000? (v/1000)+' km' : v+' m'; el.querySelector('div').style.width=(v*view.s)+'px';
}

/* ---------- interaction ---------- */
const pts=new Map(); let moved=false, last=null, pinch=null;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.offsetX,e.offsetY]); moved=false; last=[e.offsetX,e.offsetY];
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]), m:[(a[0]+b[0])/2,(a[1]+b[1])/2]}; } });
cv.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.offsetX,e.offsetY]);
  if(pts.size===2&&pinch){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]), m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    view.cx-=(m[0]-pinch.m[0])/view.s; view.cy-=(m[1]-pinch.m[1])/view.s; zoomAt(d/pinch.d,m[0],m[1]); pinch={d,m}; moved=true; return; }
  const dx=e.offsetX-last[0], dy=e.offsetY-last[1]; if(Math.abs(dx)+Math.abs(dy)>3||moved){ moved=true; cv.classList.add('drag'); view.cx-=dx/view.s; view.cy-=dy/view.s; last=[e.offsetX,e.offsetY]; draw(); } });
const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; cv.classList.remove('drag'); if(pts.size===1){ last=[...pts.values()][0]; } };
cv.addEventListener('pointerup',e=>{ const wasMove=moved; up(e); if(!wasMove && pts.size===0) onTap(e.offsetX,e.offsetY); });
cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(Math.exp(-e.deltaY*(e.deltaMode?0.05:0.0016)), e.offsetX, e.offsetY); },{passive:false});
cv.addEventListener('dblclick',e=>zoomAt(2,e.offsetX,e.offsetY));
$('zin').onclick=()=>zoomAt(1.6,W/2,H/2); $('zout').onclick=()=>zoomAt(1/1.6,W/2,H/2); $('home').onclick=home;

function onTap(sx,sy){
  const [wx,wy]=S2W(sx,sy);
  if(picking){ const p={x:wx,y:wy,name:placeName(wx,wy)}; setEnd(picking,p); picking=null; cv.classList.remove('pick'); hideToast(); return; }
  let best=null,bd=18*18;
  for(const p of pois){ if(!poiVisible(p)) continue; const [x,y]=W2S(p.x,p.y); const d=(x-sx)**2+(y-sy)**2; if(d<bd){bd=d;best=p;} }
  if(best) select(best, false); else { selected=null; renderSel(); draw(); }
}
function placeName(x,y){ const n=nearestNode(x,y); for(let k=0;k<adj[n].length;k+=4){ const r=roads[adj[n][k+3]]; if(r.name) return 'Gần '+r.name; } return 'Điểm trên bản đồ'; }

/* ---------- UI: chips, list, selection ---------- */
const counts={}; pois.forEach(p=>counts[p.cat]=(counts[p.cat]||0)+1);
const chipsEl=$('chips'); let onlyCat=null;
Object.entries(CATS).forEach(([k,c])=>{ if(!counts[k]) return; const b=document.createElement('button'); b.className='chip'; b.dataset.k=k; b.setAttribute('aria-pressed','false');
  b.innerHTML=`<i style="background:${c.color}"></i>${c.name} <span class="n">${counts[k]}</span>`;
  b.onclick=()=>{ onlyCat = onlyCat===k?null:k; filter = new Set(onlyCat?[onlyCat]:Object.keys(CATS));
    chipsEl.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.k===onlyCat?'true':'false')); renderList(); draw(); };
  chipsEl.appendChild(b); });
const streetNames=[...new Set(roads.filter(r=>r.name).map(r=>r.name))];
const norm=s=>s.normalize('NFD').replace(/\p{M}/gu,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const poiKey=pois.map(p=>norm(p.name+' '+p.addr)); const streetKey=streetNames.map(norm);
const ORDER=['gov','transit','hotel','health','bank','fuel','shop','edu','sight'];
function renderList(){
  const q=norm($('q').value.trim()); const list=$('list'); list.innerHTML='';
  let items=pois.filter((p,i)=>filter.has(p.cat) && (!q||poiKey[i].includes(q)));
  items.sort((a,b)=>ORDER.indexOf(a.cat)-ORDER.indexOf(b.cat) || a.name.localeCompare(b.name,'vi'));
  const streets = q? streetNames.filter((n,i)=>streetKey[i].includes(q)).slice(0,8):[];
  streets.forEach(n=>{ const b=document.createElement('button'); b.className='item';
    b.innerHTML=`<div class="dot" style="background:var(--muted)">Đ</div><div><b></b><span>Tuyến đường</span></div>`; b.querySelector('b').textContent=n;
    b.onclick=()=>showStreet(n); list.appendChild(b); });
  items.slice(0,250).forEach(p=>{ const b=document.createElement('button'); b.className='item';
    b.innerHTML=`<div class="dot" style="background:${CATS[p.cat].color}">${CATS[p.cat].ch}</div><div><b></b><span></span></div>`;
    b.querySelector('b').textContent=p.name; b.querySelector('span').textContent=[CATS[p.cat].name,p.addr].filter(Boolean).join(' · ');
    b.onclick=()=>select(p,true); list.appendChild(b); });
  if(!items.length && !streets.length){ list.innerHTML='<div class="empty">Không tìm thấy kết quả. Thử gõ không dấu, ví dụ “bien hoa” hoặc “khach san”.</div>'; }
}
function showStreet(n){
  const P=new Path2D(); let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  roads.filter(r=>r.name===n).forEach(r=>{ P.addPath(pathOf(r.p)); for(let i=0;i<r.p.length;i+=2){ x0=Math.min(x0,r.p[i]); x1=Math.max(x1,r.p[i]); y0=Math.min(y0,r.p[i+1]); y1=Math.max(y1,r.p[i+1]); } });
  highlightRoad={name:n,path:P}; fit(x0,y0,x1,y1); toast(n);
}
function fit(x0,y0,x1,y1){ view.cx=(x0+x1)/2; view.cy=(y0+y1)/2; view.s=Math.min(12, Math.min(W/Math.max(x1-x0,200), H/Math.max(y1-y0,200))*0.8); draw(); }
function select(p, fly){
  selected=p; highlightRoad=null; renderSel();
  if(fly){ view.cx=p.x; view.cy=p.y; view.s=Math.max(view.s,0.6); }
  draw(); if(isPhone()) panel.classList.remove('collapsed');
}
function gmaps(p){ return `https://www.google.com/maps/dir/?api=1&destination=${p.lat.toFixed(6)},${p.lon.toFixed(6)}`; }
function renderSel(){
  const el=$('sel'); el.innerHTML=''; if(!selected) return; const p=selected;
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<h2></h2><div class="meta"></div><div class="row">
    <button class="btn primary" data-a="to">Đến đây</button><button class="btn" data-a="from">Đi từ đây</button>
    <a class="btn" target="_blank" rel="noopener">Dẫn đường bằng Google Maps ↗</a></div>`;
  c.querySelector('h2').textContent=p.name;
  c.querySelector('.meta').textContent=[CATS[p.cat].name, p.addr, p.phone&&('ĐT: '+p.phone), p.hours&&('Giờ mở cửa: '+p.hours), `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`].filter(Boolean).join(' · ');
  c.querySelector('a').href=gmaps(p);
  c.querySelector('[data-a=to]').onclick=()=>{ setEnd('b',{x:p.x,y:p.y,name:p.name}); openTab('route'); };
  c.querySelector('[data-a=from]').onclick=()=>{ setEnd('a',{x:p.x,y:p.y,name:p.name}); openTab('route'); };
  el.appendChild(c);
}

/* ---------- routing UI ---------- */
function setEnd(which,p){ if(which==='a') A=p; else B=p; renderRoute(); }
function fmtKm(m){ return m<1000? Math.round(m/10)*10+' m' : (m/1000).toFixed(1).replace('.',',')+' km'; }
function fmtMin(s){ const m=Math.max(1,Math.round(s/60)); return m<60? m+' phút' : Math.floor(m/60)+' giờ '+(m%60)+' phút'; }
function renderRoute(){
  const va=$('v-a'), vb=$('v-b');
  va.textContent=A?A.name:'Chọn điểm đi'; va.classList.toggle('ph',!A);
  vb.textContent=B?B.name:'Chọn điểm đến'; vb.classList.toggle('ph',!B);
  $('f-a').classList.toggle('picking',picking==='a'); $('f-b').classList.toggle('picking',picking==='b');
  const out=$('route-out'); out.innerHTML='';
  route=null;
  if(A&&B){
    const r=dijkstra(nearestNode(A.x,A.y), nearestNode(B.x,B.y));
    if(!r){ out.innerHTML='<div class="empty">Không tìm được đường nối hai điểm này trong dữ liệu hiện có.</div>'; }
    else{
      route=r;
      const sum=document.createElement('div'); sum.className='sum'; sum.innerHTML=`<strong>${fmtKm(r.len)}</strong><span>khoảng ${fmtMin(r.time)} đi ô tô / xe máy</span>`; out.appendChild(sum);
      const st=document.createElement('div'); st.className='steps';
      r.steps.filter(s=>s.len>15).forEach((s,i)=>{ const d=document.createElement('div'); d.className='step'; d.innerHTML='<span></span><em></em>'; d.firstChild.textContent=(i?'Tiếp theo ':'Đi theo ')+s.name; d.lastChild.textContent=fmtKm(s.len); st.appendChild(d); });
      out.appendChild(st);
      const [lon,lat]=unproj(B.x,B.y), [lon0,lat0]=unproj(A.x,A.y);
      const a=document.createElement('a'); a.className='btn'; a.target='_blank'; a.rel='noopener'; a.style.alignSelf='flex-start'; a.style.marginTop='6px';
      a.href=`https://www.google.com/maps/dir/?api=1&origin=${lat0.toFixed(6)},${lon0.toFixed(6)}&destination=${lat.toFixed(6)},${lon.toFixed(6)}`; a.textContent='Mở tuyến này trong Google Maps ↗'; out.appendChild(a);
      let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; r.nodes.forEach(n=>{x0=Math.min(x0,NX[n]);x1=Math.max(x1,NX[n]);y0=Math.min(y0,NY[n]);y1=Math.max(y1,NY[n]);}); fit(x0,y0,x1,y1);
    }
  } else out.innerHTML='<div class="empty">Chọn một địa điểm trong danh sách rồi bấm “Đến đây” / “Đi từ đây”, hoặc bấm “Chọn trên bản đồ” rồi chạm vào vị trí cần đến.</div>';
  draw();
}
$('pick-a').onclick=()=>{ picking='a'; cv.classList.add('pick'); toast('Chạm vào bản đồ để chọn điểm đi'); renderRoute(); if(isPhone()) panel.classList.add('collapsed'); };
$('pick-b').onclick=()=>{ picking='b'; cv.classList.add('pick'); toast('Chạm vào bản đồ để chọn điểm đến'); renderRoute(); if(isPhone()) panel.classList.add('collapsed'); };
$('swap').onclick=()=>{ [A,B]=[B,A]; renderRoute(); };
$('clear').onclick=()=>{ A=B=null; route=null; renderRoute(); };
function openTab(t){
  $('tab-find').setAttribute('aria-selected',t==='find'); $('tab-route').setAttribute('aria-selected',t==='route');
  $('view-find').hidden = t!=='find'; $('view-route').hidden = t!=='route';
  $('view-find').style.display = t==='find'?'flex':'none'; $('view-route').style.display = t==='route'?'flex':'none';
  if(t==='route') renderRoute();
}
$('tab-find').onclick=()=>openTab('find'); $('tab-route').onclick=()=>openTab('route');
$('q').addEventListener('input',()=>{ openTab('find'); renderList(); });

let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); if(!picking) tt=setTimeout(hideToast,2500); }
function hideToast(){ $('toast').hidden=true; }
const panel=$('panel'); const isPhone=()=>matchMedia('(max-width:760px)').matches;
$('grab').onclick=()=>{ panel.classList.toggle('collapsed'); requestAnimationFrame(resize); };
new ResizeObserver(()=>resize()).observe(wrap);

/* ---------- theme + fonts ---------- */
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readTheme();draw();});
new MutationObserver(()=>{readTheme();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
document.fonts && document.fonts.ready.then(draw);

$('loading').remove();
resize(); home(); renderList();
})();
</script>
